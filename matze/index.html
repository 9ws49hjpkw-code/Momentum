<!DOCTYPE html>
<!-- Nur für Matze: Türsteher vor Momentum 1.1.1 (Stand 19.11.2026, vor dem ersten Nachtbau). Von Hand geschrieben, bleibt eingefroren. -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Momentum · für Matze</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04070C">
<meta name="color-scheme" content="dark">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:#04070C;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;color:#E8F1F8;
  font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;text-align:center;
  padding:env(safe-area-inset-top) 28px env(safe-area-inset-bottom);
  background:radial-gradient(80% 50% at 50% 38%,rgba(98,217,255,.13),transparent 70%),#04070C;transition:background .8s}
svg{width:104px;height:104px;overflow:visible;filter:drop-shadow(0 0 14px rgba(98,217,255,.55))}
svg path{fill:none;stroke:#7FE0FF;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
#ring{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 1.3s cubic-bezier(.5,0,.2,1) .2s forwards}
#tick{stroke-dasharray:90;stroke-dashoffset:90}
@keyframes draw{to{stroke-dashoffset:0}}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;opacity:0;animation:up .7s cubic-bezier(.3,1.3,.5,1) .9s forwards}
.small{color:#8A9BAD;font-size:15px;margin-top:8px}
.btns{display:flex;gap:14px;width:100%;max-width:340px;opacity:0;animation:up .7s cubic-bezier(.3,1.3,.5,1) 1.15s forwards}
button{flex:1;min-height:56px;border-radius:18px;font:600 18px -apple-system,system-ui,sans-serif;border:1px solid rgba(127,224,255,.35);
  color:#E8F1F8;background:rgba(255,255,255,.05);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  transition:transform .3s cubic-bezier(.3,1.5,.5,1),opacity .4s}
button:active{transform:scale(.94)}
#ja{color:#04070C;border:0;background:linear-gradient(90deg,#7FE0FF,#B5EEFF);box-shadow:0 0 26px rgba(98,217,255,.4)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.gone{opacity:0!important;pointer-events:none;transition:opacity .45s}
#msg{position:fixed;left:28px;right:28px;top:50%;transform:translateY(-50%);font-size:22px;font-weight:600;opacity:0;transition:opacity .6s;pointer-events:none}
#msg.on{opacity:1}
#nochmal{white-space:nowrap;position:fixed;bottom:calc(env(safe-area-inset-bottom) + 28px);left:50%;transform:translateX(-50%);min-height:44px;
  flex:none;padding:0 18px;font-size:14px;font-weight:500;color:#5E6E7E;background:none;border:0;opacity:0;pointer-events:none;transition:opacity .8s}
#nochmal.on{opacity:1;pointer-events:auto}
body.black{background:#000}
body.black #msg{opacity:0}
body.yes svg{transition:transform .9s cubic-bezier(.5,0,.2,1),filter .9s;transform:scale(1.25);filter:drop-shadow(0 0 30px rgba(98,217,255,.95))}
body.yes #tick{transition:stroke-dashoffset .5s ease-out;stroke-dashoffset:0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<svg viewBox="0 0 100 100" aria-hidden="true">
  <path id="ring" d="M 79 39 A 31 31 0 1 1 63 22"/>
  <path id="tick" d="M 37 51 L 47 61 L 76 28"/>
</svg>
<div id="frage"><h1>Heißt du Matze?</h1><p class="small h1-sub" style="opacity:0;animation:up .7s cubic-bezier(.3,1.3,.5,1) 1s forwards">Ehrlich jetzt.</p></div>
<div class="btns"><button id="nein" type="button">Nein</button><button id="ja" type="button">Ja</button></div>
<div id="msg"></div>
<button id="nochmal" type="button">Doch Matze? Nochmal fragen</button>
<script>
const ZIEL = '../versionen/1.1.1/';
const $ = s => document.querySelector(s), msg = $('#msg');
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const buzz = () => { try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} };
function hide() { $('#frage').classList.add('gone'); $('.btns').classList.add('gone'); }
function say(t) { msg.textContent = t; msg.classList.add('on'); }
$('#ja').addEventListener('click', () => {
  buzz(); hide(); document.body.classList.add('yes');
  setTimeout(() => say('Willkommen, Matze.'), calm ? 0 : 500);
  setTimeout(() => location.replace(ZIEL), calm ? 900 : 2100);
});
$('#nein').addEventListener('click', () => {
  buzz(); hide(); say('Dann ist das hier nicht für dich.');
  setTimeout(() => { document.body.classList.add('black'); $('svg').classList.add('gone'); try { window.close(); } catch (e) {} }, calm ? 1200 : 2000);
  setTimeout(() => $('#nochmal').classList.add('on'), 5000);
});
$('#nochmal').addEventListener('click', () => location.reload());
</script>
</body>
</html>
