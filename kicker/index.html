<style>
/* Layout: App-Shell mit Kopfzeile, scrollendem Inhalt und Aktionsleiste im Daumenbereich.
   Auf dem iPad quer: links "Jetzt spielt", rechts Plan/Bracket. */
:root{
  --bg:#0D0F13;
  --surface:#15181E;
  --surface-2:#1C2028;
  --surface-3:#252A33;
  --line:rgba(236,232,224,.08);
  --line-2:rgba(236,232,224,.14);
  --text:#F1EFEA;
  --muted:#9097A3;
  --dim:#5E6470;
  --brass:#E4B76C;
  --brass-2:#C9974B;
  --brass-ink:#1A1408;
  --brass-soft:rgba(228,183,108,.12);
  --danger:#EE7B6E;
  --ok:#8FD19E;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;overscroll-behavior:none}
body{font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button,.chip,.tab,.seg{-webkit-user-select:none;user-select:none}
input{font:inherit;color:inherit}
svg{display:block}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

#app{position:fixed;inset:0;display:flex;flex-direction:column}
.topbar{flex:none;display:flex;align-items:center;gap:12px;
  padding:calc(var(--sat) + 10px) max(20px, var(--sar)) 10px max(20px, var(--sal));
  min-height:calc(var(--sat) + 64px);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar h1{margin:0;font:700 19px/1.2 var(--font-display);letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{color:var(--muted);font-weight:500}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none;transition:transform .15s var(--ease),background .2s}
.iconbtn:active{transform:scale(.92);background:var(--surface-2)}
.iconbtn svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:8px max(20px, var(--sar)) calc(var(--sab) + 120px) max(20px, var(--sal))}
.wrap{max-width:1180px;margin:0 auto}
.narrow{max-width:760px;margin:0 auto}

.view-enter{animation:viewIn .5s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- Typo ---------- */
.eyebrow{font:600 12px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.h-xl{font:800 clamp(44px,8vw,84px)/.95 var(--font-display);letter-spacing:-.035em;margin:0}
.h-lg{font:750 clamp(28px,4.4vw,40px)/1.05 var(--font-display);letter-spacing:-.025em;margin:0;text-wrap:balance}
.h-md{font:700 22px/1.2 var(--font-display);letter-spacing:-.015em;margin:0}
.lead{color:var(--muted);font-size:17px;max-width:56ch;margin:0}
.muted{color:var(--muted)}
.brass{color:var(--brass)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 26px;border-radius:999px;
  font-weight:650;font-size:17px;letter-spacing:-.005em;transition:transform .15s var(--ease),opacity .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:linear-gradient(180deg,#EDC57F,var(--brass-2));color:var(--brass-ink);box-shadow:0 10px 30px -12px rgba(228,183,108,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.btn-ghost{background:var(--surface);border:1px solid var(--line-2);color:var(--text)}
.btn-quiet{color:var(--muted);min-height:48px;padding:0 16px}
.btn-danger{background:rgba(238,123,110,.12);color:var(--danger);border:1px solid rgba(238,123,110,.25)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn-block{width:100%}

.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:16px max(20px, var(--sar)) calc(var(--sab) + 16px) max(20px, var(--sal));
  background:linear-gradient(180deg,rgba(13,15,19,0),rgba(13,15,19,.92) 35%,var(--bg));pointer-events:none}
.actionbar .inner{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center;pointer-events:auto}
.actionbar .inner .btn-primary{flex:1}
.actionbar .hint{flex:1;color:var(--muted);font-size:14px}

/* ---------- Home ---------- */
.home{padding-top:clamp(12px,5vh,64px);display:grid;gap:34px}
.home .hero{display:grid;gap:14px}
.home .hero .h-xl span{color:var(--brass)}
.home .hero .by{font:italic 400 clamp(22px,3.2vw,34px)/1 ui-serif,"New York",Georgia,serif;letter-spacing:0;color:var(--brass);white-space:nowrap;margin-left:.15em}
.modes{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.mode{position:relative;text-align:left;border-radius:28px;padding:28px;min-height:280px;display:flex;flex-direction:column;gap:14px;
  background:radial-gradient(120% 90% at 100% 0%,rgba(228,183,108,.10),transparent 55%),var(--surface);
  border:1px solid var(--line);overflow:hidden;transition:transform .25s var(--ease),border-color .25s}
.mode:active{transform:scale(.985);border-color:var(--line-2)}
.mode .art{height:84px;display:flex;align-items:center}
.mode .art svg{height:84px;width:auto}
.mode h3{margin:0;font:750 30px/1.05 var(--font-display);letter-spacing:-.025em}
.mode p{margin:0;color:var(--muted);font-size:16px;max-width:38ch}
.mode .tags{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.mode .go{position:absolute;right:24px;bottom:24px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--brass);color:var(--brass-ink)}
.mode .go svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.resume{display:flex;align-items:center;gap:18px;padding:18px 18px 18px 22px;border-radius:22px;background:var(--brass-soft);border:1px solid rgba(228,183,108,.3);text-align:left;width:100%}
.resume .t{flex:1;min-width:0}
.resume .t b{display:block;font:700 18px/1.25 var(--font-display)}
.resume .t span{color:var(--muted);font-size:14px}
.resume .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden}
.resume .bar i{display:block;height:100%;background:var(--brass);border-radius:3px}
.foot{color:var(--dim);font-size:13px;text-align:center;padding-top:8px}

/* ---------- Setup ---------- */
.setup{display:grid;gap:26px;padding-top:8px}
.stepper{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px;width:max-content}
.stepper button{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);transition:transform .15s var(--ease)}
.stepper button:active{transform:scale(.9)}
.stepper button[disabled]{opacity:.3}
.stepper button svg{width:22px;height:22px;stroke:var(--text);stroke-width:2;fill:none;stroke-linecap:round}
.stepper .val{min-width:96px;text-align:center}
.stepper .val b{display:block;font:700 34px/1 var(--font-num)}
.stepper .val small{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.names{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.field{position:relative}
.field .idx{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--dim);font:600 14px var(--font-num);pointer-events:none}
.field input{width:100%;height:56px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:0 16px 0 46px;font-size:18px;outline:none;transition:border-color .2s,background .2s;-webkit-appearance:none}
.field input:focus{border-color:rgba(228,183,108,.6);background:var(--surface-2)}
.field input::placeholder{color:var(--dim)}
.field.err input{border-color:var(--danger)}
.field.new{animation:pop .35s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.errmsg{color:var(--danger);font-size:14px}

.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{min-width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font:700 24px var(--font-num);transition:transform .15s var(--ease),background .2s,color .2s,border-color .2s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.chip.off{opacity:.28}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.stat b{display:block;font:700 30px/1.1 var(--font-num)}
.stat span{color:var(--muted);font-size:13px}
.note{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:15px}
.note svg{flex:none;width:20px;height:20px;margin-top:1px;stroke:var(--brass);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.note b{color:var(--text);font-weight:600}

.segctl{display:inline-flex;padding:5px;border-radius:999px;background:var(--surface);border:1px solid var(--line);gap:4px}
.seg{height:46px;padding:0 20px;border-radius:999px;font-weight:600;color:var(--muted);transition:background .25s var(--ease),color .2s}
.seg.on{background:var(--surface-3);color:var(--text)}

.teams{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.team{grid-template-columns:minmax(0,1fr);border-radius:20px;background:var(--surface);border:1px solid var(--line);padding:14px 14px 16px;display:grid;gap:10px;animation:pop .4s var(--ease) both}
.team .row{display:flex;gap:8px;align-items:center}
.team input{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid transparent;background:var(--surface-2);padding:0 14px;font:700 18px var(--font-display);outline:none}
.team input:focus{border-color:rgba(228,183,108,.6)}
.team .members{color:var(--muted);font-size:16px;padding-left:4px}
.team .members b{color:var(--text);font-weight:600}
.smallbtn{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);flex:none;transition:transform .15s var(--ease)}
.smallbtn:active{transform:scale(.9)}
.smallbtn svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.joker{border-radius:20px;padding:16px 18px;display:flex;gap:14px;align-items:center;border:1px dashed rgba(228,183,108,.45);background:var(--brass-soft)}
.jbadge{flex:none;display:inline-grid;place-items:center;height:26px;padding:0 9px;border-radius:7px;background:var(--brass);color:var(--brass-ink);font:800 11px/1 var(--font);letter-spacing:.12em}
.joker .t{color:var(--muted);font-size:15px}
.joker .t b{color:var(--text);font-size:17px;display:block}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.pchip{height:52px;padding:0 20px;border-radius:999px;background:var(--surface);border:1px solid var(--line-2);font-weight:600;font-size:17px;transition:transform .15s var(--ease),background .2s,color .2s}
.pchip:active{transform:scale(.95)}
.pchip.sel{background:var(--brass);color:var(--brass-ink);border-color:transparent}

/* ---------- Live ---------- */
.live{display:grid;gap:22px;padding-top:6px}
@media (min-width:980px){
  .live{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start;gap:28px}
  .live .left{position:sticky;top:0}
}
.left{display:grid;gap:16px}
.now{position:relative;border-radius:30px;padding:26px 26px 24px;overflow:hidden;
  background:radial-gradient(90% 70% at 50% 0%,rgba(228,183,108,.16),transparent 60%),linear-gradient(180deg,#1A1E26,#14171D);
  border:1px solid rgba(228,183,108,.22);box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.now.swap{animation:swapIn .6s var(--ease) both}
@keyframes swapIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.now .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.live-dot{display:inline-flex;align-items:center;gap:8px;font:700 12px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.live-dot i{width:8px;height:8px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 0 rgba(228,183,108,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(228,183,108,.55)}70%{box-shadow:0 0 0 10px rgba(228,183,108,0)}100%{box-shadow:0 0 0 0 rgba(228,183,108,0)}}
.count{color:var(--muted);font:600 14px var(--font-num)}
.versus{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:14px}
.side{display:grid;gap:4px;min-width:0}
.side.r{text-align:right}
.side .who{font:750 clamp(22px,3vw,32px)/1.1 var(--font-display);letter-spacing:-.02em;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.side .sm .jk{color:var(--brass);font-weight:600}
.side .who .amp{color:var(--dim);font-weight:500}
.side .sm{color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.vs{font:800 14px/1 var(--font);letter-spacing:.18em;color:var(--brass);width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(228,183,108,.35)}
.now .jline{margin-top:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:15px}
.now .jline b{color:var(--text)}
.now .jline button{margin-left:auto;color:var(--brass);font-weight:600;font-size:15px;min-height:44px;padding:0 6px}
.now .cta{margin-top:22px}
.pause{margin-top:14px;color:var(--muted);font-size:14px;text-align:center}
.pause b{color:var(--text);font-weight:600}

.next{border-radius:22px;padding:18px 20px;background:var(--surface);border:1px solid var(--line);display:grid;gap:8px}
.next .row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font:650 18px/1.3 var(--font-display)}
.next .row .v{color:var(--dim);font:600 13px var(--font);letter-spacing:.1em}
.next .ph{color:var(--muted);font-style:normal;font-weight:500}

.tabs{display:flex;gap:6px;padding:5px;border-radius:999px;background:var(--surface);border:1px solid var(--line);width:max-content;max-width:100%}
.tab{height:44px;padding:0 20px;border-radius:999px;font-weight:600;color:var(--muted);transition:background .25s var(--ease),color .2s}
.tab.on{background:var(--surface-3);color:var(--text)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.right{display:grid;gap:16px;min-width:0}

/* Spielplan */
.plan{display:grid;gap:8px}
.pm{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%;transition:transform .15s var(--ease),border-color .2s}
.pm:active{transform:scale(.99)}
.pm .no{font:700 15px var(--font-num);color:var(--dim);text-align:center}
.pm .duo{font-weight:600;font-size:16px;line-height:1.35;min-width:0}
.pm .duo .v{color:var(--dim);font-weight:500;font-size:13px;margin:0 6px;letter-spacing:.06em}
.pm .duo .w{color:var(--brass)}
.pm .res{font:700 20px var(--font-num);min-width:64px;text-align:right}
.pm .res.todo{color:var(--dim);font-size:13px;font-weight:600;font-family:var(--font)}
.pm.cur{border-color:rgba(228,183,108,.45);background:linear-gradient(90deg,rgba(228,183,108,.10),var(--surface) 60%)}
.pm.cur .no{color:var(--brass)}
.pm.done{opacity:.72}
.plan.reroll .pm{animation:pop .45s var(--ease) both}

/* Rangliste */
.table{display:grid;gap:8px}
.tr{display:grid;grid-template-columns:40px 1fr auto auto;gap:14px;align-items:center;padding:12px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);animation:pop .4s var(--ease) both}
.tr .pl{font:700 18px var(--font-num);color:var(--dim);text-align:center}
.tr .nm{font-weight:650;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .nm small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.tr .wdl{color:var(--muted);font:600 14px var(--font-num);text-align:right}
.tr .gl{font:800 26px var(--font-num);min-width:52px;text-align:right}
.tr.top1{background:linear-gradient(90deg,rgba(228,183,108,.16),var(--surface) 70%);border-color:rgba(228,183,108,.35)}
.tr.top1 .pl,.tr.top1 .gl{color:var(--brass)}
.th{display:grid;grid-template-columns:40px 1fr auto auto;gap:14px;padding:0 16px;color:var(--dim);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.th span:nth-child(3){text-align:right}
.th span:nth-child(4){min-width:52px;text-align:right}

/* Bracket */
.bk-sec{display:grid;gap:10px}
.bk-scroll{-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent);overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:4px 4px 10px}
.bk{display:flex;gap:14px;align-items:stretch;width:max-content}
.bk-col{display:flex;flex-direction:column;gap:10px;width:208px}
.bk-cards{flex:1;display:flex;flex-direction:column;gap:10px;justify-content:space-around}
.bk-col h4{margin:0 0 2px;font:600 12px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.bm{border-radius:14px;background:var(--surface);border:1px solid var(--line);overflow:hidden;text-align:left;width:100%;transition:transform .15s var(--ease)}
.bm:active{transform:scale(.98)}
.bm .lab{display:flex;justify-content:space-between;padding:7px 12px 0;font:600 11px var(--font);letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.bm .t{display:flex;justify-content:space-between;gap:8px;padding:6px 12px;font-weight:600;font-size:15px;white-space:nowrap}
.bm .t span:first-child{overflow:hidden;text-overflow:ellipsis}
.bm .t + .t{border-top:1px solid var(--line)}
.bm .t:last-child{padding-bottom:9px}
.bm .t.win{color:var(--brass)}
.bm .t.lose{color:var(--dim)}
.bm .t.ph{color:var(--dim);font-weight:500;font-style:italic}
.bm .t .g{font-family:var(--font-num);color:inherit}
.bm.cur{border-color:rgba(228,183,108,.55);box-shadow:0 0 0 3px rgba(228,183,108,.12)}
.bm.byes{background:transparent;border-style:dashed}
.byelist{display:flex;gap:8px;flex-wrap:wrap}

.tlist{display:grid;gap:8px}
.tl{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.tl .nm{font-weight:700;font-size:17px}
.tl .nm small{display:block;color:var(--muted);font-weight:500;font-size:14px}
.tl .st{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.lives{display:flex;gap:5px}
.lives i{width:10px;height:10px;border-radius:50%;background:var(--brass)}
.lives i.gone{background:transparent;border:1.5px solid var(--dim)}
.pill{font-size:12px;font-weight:700;letter-spacing:.06em;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.w{background:var(--brass-soft);color:var(--brass)}
.pill.l{background:rgba(255,255,255,.06);color:var(--text)}
.pill.out{color:var(--dim)}
.tl.out{opacity:.5}

/* ---------- Sheet / Modal ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(5,6,8,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s ease both}
@media (min-width:700px){.scrim{align-items:center}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{grid-template-columns:minmax(0,1fr);width:100%;max-width:640px;max-height:calc(100% - var(--sat) - 20px);overflow-y:auto;background:linear-gradient(180deg,#1B1F27,#14171D);border:1px solid var(--line-2);
  border-radius:28px 28px 0 0;padding:26px max(22px, var(--sar)) calc(var(--sab) + 22px) max(22px, var(--sal));animation:up .4s var(--ease) both;display:grid;gap:20px}
@media (min-width:700px){.sheet{border-radius:28px;padding:30px}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet.closing{animation:down .22s ease both}
.scrim.closing{animation:fade .22s ease reverse both}
@keyframes down{to{transform:translateY(30px);opacity:0}}
.sheet .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.score{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sc{border-radius:22px;background:var(--surface);border:1px solid var(--line);padding:18px 14px;display:grid;gap:14px;justify-items:center;text-align:center;transition:border-color .2s,background .2s}
.sc.ahead{border-color:rgba(228,183,108,.5);background:linear-gradient(180deg,rgba(228,183,108,.12),var(--surface))}
.sc .who{font:700 18px/1.25 var(--font-display);min-height:46px;display:flex;align-items:center;justify-content:center;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;max-width:100%}
.sc .big{font:800 76px/1 var(--font-num);letter-spacing:-.02em}
.sc .big.bump{animation:bump .25s var(--ease)}
@keyframes bump{40%{transform:scale(1.14)}}
.sc .pm2{display:flex;gap:12px}
.sc .pm2 button{width:68px;height:68px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line-2);display:grid;place-items:center;transition:transform .12s var(--ease),background .2s}
.sc .pm2 button:active{transform:scale(.88);background:var(--surface-3)}
.sc .pm2 button svg{width:26px;height:26px;stroke:var(--text);stroke-width:2.2;fill:none;stroke-linecap:round}
.sc .pm2 button.plus{background:var(--brass);border-color:transparent}
.sc .pm2 button.plus svg{stroke:var(--brass-ink)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pk{border-radius:22px;padding:22px 16px;background:var(--surface);border:1.5px solid var(--line);display:grid;gap:6px;justify-items:center;text-align:center;min-height:150px;align-content:center;transition:transform .15s var(--ease),border-color .2s,background .2s}
.pk:active{transform:scale(.97)}
.pk b{font:750 clamp(18px,2.6vw,22px)/1.15 var(--font-display);hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;max-width:100%}
.pk small{color:var(--muted);font-size:14px}
.pk .crown{width:34px;height:34px;opacity:.18;transition:opacity .2s,transform .3s var(--ease)}
.pk .crown svg{width:34px;height:34px;stroke:var(--brass);fill:none;stroke-width:1.7;stroke-linejoin:round}
.pk.on{border-color:var(--brass);background:linear-gradient(180deg,rgba(228,183,108,.16),var(--surface))}
.pk.on .crown{opacity:1;transform:translateY(-2px) scale(1.1)}
.pk.on small{color:var(--brass)}
.opt{border-top:1px solid var(--line);padding-top:16px;display:grid;gap:14px}
.opt summary{list-style:none;color:var(--muted);font-weight:600;min-height:44px;display:flex;align-items:center;gap:8px;cursor:pointer}
.opt summary::-webkit-details-marker{display:none}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini .ms{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px}
.mini .ms button{width:48px;height:48px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.mini .ms button svg{width:20px;height:20px;stroke:var(--text);stroke-width:2.2;fill:none;stroke-linecap:round}
.mini .ms b{font:800 26px var(--font-num)}
.sheet .btns{display:grid;gap:10px}
.menu{display:grid;gap:10px}
.menu .btn{justify-content:flex-start}

/* ---------- Siegerehrung ---------- */
.win-ov{position:fixed;inset:0;z-index:60;background:radial-gradient(80% 60% at 50% 30%,rgba(228,183,108,.18),transparent 70%),rgba(8,9,12,.94);display:flex;align-items:center;justify-content:center;overflow-y:auto;
  padding:calc(var(--sat) + 30px) max(20px, var(--sar)) calc(var(--sab) + 30px) max(20px, var(--sal));animation:fade .4s ease both}
.win-box{width:100%;max-width:760px;display:grid;gap:26px;justify-items:center;text-align:center}
.trophy{width:96px;height:96px;animation:rise .9s var(--ease) both}
.trophy svg{width:96px;height:96px;stroke:var(--brass);fill:none;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.8)}to{opacity:1;transform:none}}
.champ{font:850 clamp(36px,7vw,72px)/1.02 var(--font-display);letter-spacing:-.035em;color:var(--brass);animation:rise .9s .15s var(--ease) both;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;max-width:100%}
.champ-sub{color:var(--muted);font-size:18px;animation:rise .9s .25s var(--ease) both}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:12px;width:100%}
.pod{display:grid;gap:10px;justify-items:center}
.pod .nm{font:700 clamp(15px,2.2vw,19px)/1.2 var(--font-display);hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;max-width:100%}
.pod .pts{color:var(--muted);font:600 15px var(--font-num)}
.pod .blk{width:100%;border-radius:18px 18px 6px 6px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:start center;padding-top:14px;font:800 34px var(--font-num);color:var(--dim);transform-origin:bottom;animation:grow .9s var(--ease) both}
.pod.p1 .blk{height:170px;background:linear-gradient(180deg,rgba(228,183,108,.35),rgba(228,183,108,.08));border-color:rgba(228,183,108,.4);color:var(--brass);animation-delay:.5s}
.pod.p2 .blk{height:120px;animation-delay:.3s}
.pod.p3 .blk{height:90px;animation-delay:.15s}
.pod.p1 .nm{color:var(--brass);font-size:23px}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;width:100%}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left}
.fact span{color:var(--muted);font-size:13px;display:block}
.fact b{font:700 18px/1.3 var(--font-display)}
.win-box .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#confetti{position:fixed;inset:0;z-index:70;pointer-events:none}

.empty{border:1px dashed var(--line-2);border-radius:20px;padding:24px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 24px);transform:translateX(-50%);z-index:80;background:var(--surface-3);border:1px solid var(--line-2);border-radius:999px;padding:12px 18px;display:flex;gap:12px;align-items:center;font-weight:600;animation:up .35s var(--ease) both;box-shadow:0 20px 40px -20px #000}
.toast button{color:var(--brass);font-weight:700;min-height:40px}

@media (max-width:520px){
  .summary{grid-template-columns:1fr 1fr}
  .summary .stat:last-child{grid-column:span 2}
  .versus{grid-template-columns:1fr;text-align:center;gap:10px}
  .side.r{text-align:center}
  .vs{margin:0 auto;width:44px;height:44px}

<script>
/* ===== Kickerabend · Spiellogik (rein, ohne DOM) ===== */
const KL = (() => {

  /* ---------- Helfer ---------- */
  function shuffle(arr, rnd = Math.random) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function matrix(n) { return Array.from({ length: n }, () => new Array(n).fill(0)); }

  /* =========================================================
     MODUS 1 · PUNKTE-PARTY (Rotations-Duo)
     ========================================================= */

  // Spiele pro Spieler sind nur gültig, wenn Spieler × Spiele durch 4 teilbar ist
  function partyValid(n, k) { return n >= 4 && k >= 1 && (n * k) % 4 === 0; }

  function partyNearestValid(n, k, max = 8) {
    let best = null;
    for (let c = 1; c <= max; c++) {
      if (!partyValid(n, c)) continue;
      if (best === null || Math.abs(c - k) < Math.abs(best - k) ||
         (Math.abs(c - k) === Math.abs(best - k) && c > best)) best = c;
    }
    return best;
  }

  // Ein Versuch: Spielplan gierig aufbauen
  function partyTry(n, k, rnd, b2bPen) {
    const M = n * k / 4;
    const rem = new Array(n).fill(k);
    const last = new Array(n).fill(-99);   // Index des letzten Spiels
    const last2 = new Array(n).fill(-99);  // Index des vorletzten Spiels
    const partner = matrix(n), opp = matrix(n);
    const matches = [];

    for (let m = 0; m < M; m++) {
      const left = M - m;
      // Wer genau so viele Spiele übrig hat wie Partien übrig sind, MUSS jetzt spielen
      // (das garantiert mathematisch, dass am Ende jeder exakt k Spiele hat)
      const chosen = [];
      for (let p = 0; p < n; p++) if (rem[p] === left) chosen.push(p);

      while (chosen.length < 4) {
        let bestP = -1, bestS = -Infinity;
        for (let p = 0; p < n; p++) {
          if (rem[p] <= 0 || chosen.includes(p)) continue;
          let s = 0;
          if (last[p] === m - 1) s -= (last2[p] === m - 2 ? 5000 : b2bPen); // 3x am Stück nie, 2x möglichst nicht
          else if (last[p] === m - 2) s -= 25;
          s += Math.min(m - last[p], 20) * 6;        // wer lange wartet, ist dran
          s += rem[p] * 10;                          // wer noch viele Spiele hat
          for (const c of chosen) s -= (partner[p][c] * 4 + opp[p][c] * 2) - (partner[p][c] + opp[p][c] === 0 ? 6 : 0);
          s += rnd() * 14;                           // Zufall
          if (s > bestS) { bestS = s; bestP = p; }
        }
        chosen.push(bestP);
      }

      // beste Aufteilung in 2 Duos
      const [a, b, c, d] = chosen;
      const splits = [[[a, b], [c, d]], [[a, c], [b, d]], [[a, d], [b, c]]];
      let best = null, bestC = Infinity;
      for (const [x, y] of splits) {
        let cost = (partner[x[0]][x[1]] ** 2 + partner[y[0]][y[1]] ** 2) * 10;
        for (const i of x) for (const j of y) cost += opp[i][j] ** 2 * 3;
        cost += rnd() * 2;
        if (cost < bestC) { bestC = cost; best = [x, y]; }
      }
      const [A, B] = best;
      partner[A[0]][A[1]]++; partner[A[1]][A[0]]++;
      partner[B[0]][B[1]]++; partner[B[1]][B[0]]++;
      for (const i of A) for (const j of B) { opp[i][j]++; opp[j][i]++; }
      for (const p of chosen) { rem[p]--; last2[p] = last[p]; last[p] = m; }
      matches.push({ a: rnd() < .5 ? A : B, b: null });
      matches[m].b = matches[m].a === A ? B : A;
    }
    return matches;
  }

  function partyStats(n, matches) {
    const M = matches.length;
    const partner = matrix(n), opp = matrix(n);
    const games = new Array(n).fill(0);
    const appear = Array.from({ length: n }, () => []);
    let b2b = 0, triple = 0;
    const met = matrix(n);
    matches.forEach((mt, i) => {
      const all = [...mt.a, ...mt.b];
      for (const p of all) { games[p]++; appear[p].push(i); }
      partner[mt.a[0]][mt.a[1]]++; partner[mt.a[1]][mt.a[0]]++;
      partner[mt.b[0]][mt.b[1]]++; partner[mt.b[1]][mt.b[0]]++;
      for (const x of mt.a) for (const y of mt.b) { opp[x][y]++; opp[y][x]++; }
      for (const x of all) for (const y of all) if (x !== y) met[x][y] = 1;
      if (i > 0) {
        const prev = [...matches[i - 1].a, ...matches[i - 1].b];
        const prev2 = i > 1 ? [...matches[i - 2].a, ...matches[i - 2].b] : [];
        for (const p of all) if (prev.includes(p)) { b2b++; if (prev2.includes(p)) triple++; }
      }
    });
    let partnerRep = 0, maxPartner = 0, oppSq = 0, maxOpp = 0, unmet = 0;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      if (!met[i][j]) unmet++;
      partnerRep += Math.max(0, partner[i][j] - 1);
      maxPartner = Math.max(maxPartner, partner[i][j]);
      oppSq += opp[i][j] ** 2;
      maxOpp = Math.max(maxOpp, opp[i][j]);
    }
    // längste Wartezeit (Spiele ohne Einsatz am Stück)
    let maxWait = 0, waitSq = 0;
    for (let p = 0; p < n; p++) {
      const seq = [-1, ...appear[p], M];
      for (let i = 1; i < seq.length; i++) {
        const g = seq[i] - seq[i - 1] - 1;
        maxWait = Math.max(maxWait, g); waitSq += g * g;
      }
    }
    return { games, b2b, triple, unmet, partnerRep, maxPartner, oppSq, maxOpp, maxWait, waitSq };
  }

  // Bewertung eines Plans. Bei 8 Spielern würde "nie zweimal hintereinander" zwei geschlossene
  // Vierergruppen erzwingen – darum zählt dort Durchmischung mehr als Pause.
  function partyCost(s, n) {
    const w = n >= 10 ? 400 : 45;
    return s.triple * 3000 + s.b2b * w + s.unmet * 30 + s.partnerRep * 100 + s.maxPartner * 40 +
           s.oppSq * 2 + s.maxOpp * 10 + s.maxWait * 15 + s.waitSq * 0.5;
  }

  function partyBuild(n, k, attempts = 1000, rnd = Math.random) {
    if (!partyValid(n, k)) throw new Error('invalid');
    let best = null, bestC = Infinity;
    const pens = [1000, 200, 60, 20];
    for (let t = 0; t < attempts; t++) {
      const ms = partyTry(n, k, rnd, pens[t % pens.length]);
      const c = partyCost(partyStats(n, ms), n);
      if (c < bestC) { bestC = c; best = ms; }
    }
    return best;
  }

  /* Rangliste: Tore → Siege → Tordifferenz */
  function partyTable(n, matches, results) {
    const rows = Array.from({ length: n }, (_, i) => ({ p: i, goals: 0, against: 0, w: 0, d: 0, l: 0, played: 0, total: 0 }));
    matches.forEach((mt, i) => {
      for (const p of [...mt.a, ...mt.b]) rows[p].total++;
      const r = results[i];
      if (!r) return;
      const add = (side, gf, ga) => side.forEach(p => {
        const row = rows[p];
        row.goals += gf; row.against += ga; row.played++;
        if (gf > ga) row.w++; else if (gf < ga) row.l++; else row.d++;
      });
      add(mt.a, r.ga, r.gb); add(mt.b, r.gb, r.ga);
    });
    rows.sort((x, y) => y.goals - x.goals || y.w - x.w ||
      (y.goals - y.against) - (x.goals - x.against));
    let place = 0;
    rows.forEach((r, i) => {
      const prev = rows[i - 1];
      if (!prev || prev.goals !== r.goals || prev.w !== r.w ||
          (prev.goals - prev.against) !== (r.goals - r.against)) place = i + 1;
      r.place = place;
    });
    return rows;
  }

  /* =========================================================
     MODUS 2 · TURNIER (Double Elimination, feste Teams)
     ========================================================= */
  const BYE = -1;

  function seeding(S) {
    let arr = [1];
    while (arr.length < S) {
      const m = arr.length * 2 + 1;
      arr = arr.flatMap(x => [x, m - x]);
    }
    return arr; // Setzpositionen 1..S
  }

  // Struktur für T Teams. Freilose = Setzplätze >= T.
  function cupBuild(T) {
    const n = Math.max(1, Math.ceil(Math.log2(T)));
    const S = 2 ** n;
    const so = seeding(S);
    const M = {};      // id -> {id, br, round, idx, s1, s2}
    const order = [];
    const add = (id, br, round, idx, s1, s2, key) => { M[id] = { id, br, round, idx, s1, s2, key }; order.push(id); };

    for (let r = 1; r <= n; r++) {
      const cnt = S / 2 ** r;
      for (let i = 0; i < cnt; i++) {
        const s1 = r === 1 ? { t: 'seed', i: so[2 * i] - 1 } : { t: 'win', m: `W${r - 1}-${2 * i}` };
        const s2 = r === 1 ? { t: 'seed', i: so[2 * i + 1] - 1 } : { t: 'win', m: `W${r - 1}-${2 * i + 1}` };
        add(`W${r}-${i}`, 'W', r, i, s1, s2, 2 * r - 1);
      }
    }
    const LR = n >= 2 ? 2 * (n - 1) : 0;
    for (let q = 1; q <= LR; q++) {
      let cnt;
      if (q === 1) cnt = S / 4;
      else if (q % 2 === 0) cnt = S / 2 ** (q / 2 + 1);
      else cnt = S / 2 ** ((q - 1) / 2 + 2);
      for (let i = 0; i < cnt; i++) {
        let s1, s2;
        if (q === 1) {
          s1 = { t: 'lose', m: `W1-${2 * i}` }; s2 = { t: 'lose', m: `W1-${2 * i + 1}` };
        } else if (q % 2 === 0) {
          const j = q / 2;                       // Verlierer aus Gewinner-Runde j+1 kommen rein
          const wi = (j % 2 === 1) ? cnt - 1 - i : i; // gespiegelt, um frühe Revanchen zu vermeiden
          s1 = { t: 'win', m: `L${q - 1}-${i}` }; s2 = { t: 'lose', m: `W${j + 1}-${wi}` };
        } else {
          s1 = { t: 'win', m: `L${q - 1}-${2 * i}` }; s2 = { t: 'win', m: `L${q - 1}-${2 * i + 1}` };
        }
        add(`L${q}-${i}`, 'L', q, i, s1, s2, q + 1);
      }
    }
    const lbChamp = n >= 2 ? { t: 'win', m: `L${LR}-0` } : { t: 'lose', m: `W1-0` };
    add('GF', 'F', 1, 0, { t: 'win', m: `W${n}-0` }, lbChamp, 100);
    add('GF2', 'F', 2, 0, { t: 'win', m: 'GF' }, { t: 'lose', m: 'GF' }, 101);
    return { T, n, S, LR, M, order };
  }

  // Ergebnisse auswerten. seeds[i] = Team auf Setzplatz i. results[id] = {a,b,winner,...}
  function cupResolve(br, seeds, results) {
    const memo = {};
    const part = (src) => {
      if (src.t === 'seed') return src.i < br.T ? seeds[src.i] : BYE;
      const o = outcome(src.m);
      if (!o) return null;
      return src.t === 'win' ? o.w : o.l;
    };
    const outcome = (id) => {
      if (id in memo) return memo[id];
      memo[id] = null;
      const m = br.M[id];
      let res = null;
      if (id === 'GF2') {
        const g = outcome('GF');
        // Entscheidungsspiel nur, wenn der Verlierer-Bracket-Sieger das Finale gewinnt
        if (!g || g.auto || g.w !== part(br.M.GF.s2)) { memo[id] = { none: true }; return memo[id]; }
      }
      const a = part(m.s1), b = part(m.s2);
      if (a === null || b === null) { memo[id] = null; return null; }
      if (a === BYE && b === BYE) res = { w: BYE, l: BYE, auto: true, a, b };
      else if (a === BYE) res = { w: b, l: BYE, auto: true, a, b };
      else if (b === BYE) res = { w: a, l: BYE, auto: true, a, b };
      else {
        const r = results[id];
        if (r && ((r.a === a && r.b === b) || (r.a === b && r.b === a)) && (r.winner === a || r.winner === b)) {
          res = { w: r.winner, l: r.winner === a ? b : a, a, b, played: true };
        } else res = null;
      }
      memo[id] = res;
      return res;
    };
    const info = {};
    for (const id of br.order) {
      const m = br.M[id];
      const o = outcome(id);
      if (o && o.none) { info[id] = { id, exists: false }; continue; }
      info[id] = {
        id, exists: true,
        a: part(m.s1), b: part(m.s2),
        outcome: o,
        played: !!(o && o.played),
        auto: !!(o && o.auto),
        ready: !o && part(m.s1) !== null && part(m.s2) !== null
      };
    }
    // Champion
    let champ = null, second = null;
    const gf = info.GF, gf2 = info.GF2;
    if (gf.outcome && !gf.outcome.auto) {
      if (!gf2.exists) { champ = gf.outcome.w; second = gf.outcome.l; }
      else if (gf2.outcome) { champ = gf2.outcome.w; second = gf2.outcome.l; }
    } else if (gf.outcome && gf.outcome.auto) { champ = gf.outcome.w; }
    let third = null;
    if (br.LR > 0) {
      const lf = info[`L${br.LR}-0`];
      if (lf && lf.outcome && lf.outcome.played) third = lf.outcome.l;
    }
    return { info, champ, second, third, part };
  }

  // Ungültig gewordene Ergebnisse (nach Korrektur) entfernen
  function cupSanitize(br, seeds, results) {
    const clean = { ...results };
    let removed = [];
    for (let loop = 0; loop < 50; loop++) {
      const { info } = cupResolve(br, seeds, clean);
      let changed = false;
      for (const id of Object.keys(clean)) {
        const it = info[id];
        if (!it || !it.exists || !it.played) { removed.push(id); delete clean[id]; changed = true; }
      }
      if (!changed) break;
    }
    return { results: clean, removed };
  }

  function cupLosses(br, info, T) {
    const losses = new Array(T).fill(0), wins = new Array(T).fill(0), games = new Array(T).fill(0);
    for (const id of br.order) {
      const it = info[id];
      if (!it.exists || !it.played) continue;
      losses[it.outcome.l]++; wins[it.outcome.w]++;
      games[it.outcome.l]++; games[it.outcome.w]++;
    }
    return { losses, wins, games };
  }

  // Nächstes Spiel wählen: Runden-Reihenfolge, Pausen für Teams, die gerade gespielt haben
  function cupPick(br, info, lastTeams, exclude = null) {
    let best = null, bestS = Infinity;
    for (const id of br.order) {
      const it = info[id];
      if (!it.exists || !it.ready || id === exclude) continue;
      const m = br.M[id];
      let s = m.key * 10 + (m.br === 'L' ? 1 : 0) + m.idx * 0.01;
      if (lastTeams.includes(it.a) || lastTeams.includes(it.b)) s += 15;
      if (s < bestS) { bestS = s; best = id; }
    }
    return best;
  }

  return { shuffle, partyValid, partyNearestValid, partyBuild, partyStats, partyTable,
           BYE, cupBuild, cupResolve, cupSanitize, cupLosses, cupPick, seeding };
})();
if (typeof module !== 'undefined') module.exports = KL;

</script>
<script>
/* ===== Kickerabend · App ===== */
(() => {
'use strict';
const BUILD = '4';
document.documentElement.lang = 'de';
const KEY = 'kickerabend.v1';
const MIN_PER_GAME = 6;          // grobe Schätzung inkl. Wechsel
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- Icons (Linien) ---------- */
const I = {

  swap: '<svg viewBox="0 0 24 24"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>'
};
const ART_PARTY = `<svg viewBox="0 0 170 84" aria-hidden="true"><g fill="none" stroke-width="2" stroke-linecap="round">
  <path d="M33 20 C 80 20, 90 64, 137 64" stroke="#E4B76C"/><path d="M33 64 C 80 64, 90 20, 137 20" stroke="#5E6470"/>
  <circle cx="20" cy="20" r="11" stroke="#E4B76C"/><circle cx="20" cy="64" r="11" stroke="#9097A3"/>
  <circle cx="150" cy="20" r="11" stroke="#9097A3"/><circle cx="150" cy="64" r="11" stroke="#E4B76C"/>
  <circle cx="85" cy="42" r="5.5" fill="#F1EFEA" stroke="none"/></g></svg>`;
const ART_CUP = `<svg viewBox="0 0 170 84" aria-hidden="true"><g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M6 10h34v20H6M6 54h34v20H6M40 20h40v44H40" stroke="#5E6470"/>
  <path d="M6 30h34v-10h40v22h40" stroke="#E4B76C"/>
  <circle cx="140" cy="42" r="13" stroke="#E4B76C"/><path d="M135 42l3.5 3.5L146 38" stroke="#E4B76C"/></g></svg>`;

const TEAM_NAMES = ['Kurbelkönige', 'Stangenfieber', 'Torfabrik', 'Die Abstauber', 'Dynamo Doppelpass', 'Eintracht Eiskalt',
  'Bandenzauber', 'Die Konterkönige', 'Real Kicker', 'Abseits gibt’s nicht', 'Kickpiraten', 'FC Wackelstange',
  'Die Schnellschüsse', 'Ballverliebt', 'Tischfeuer', 'Die Puppenspieler', 'Rotation Rakete', 'Kurbelkartell',
  'Sporting Spin', 'Die Zauberkurbler', 'Olympique Ohnegnade', 'Inter Kurbel', 'Banana Flanke', 'Die Torjäger'];

/* ---------- Zustand ---------- */
function blank() {
  return { v: 1, view: 'home', roster: [], draft: null, party: null, cup: null, tab: { party: 'plan', cup: 'bracket' }, celebrated: {} };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.v === 1) return Object.assign(blank(), s);
  } catch (e) { /* leer */ }
  return null;
}
let S = load() || blank();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* Speicher voll oder gesperrt */ } }
try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (e) {}

// Ansicht passt nicht zum Zustand → Start
if ((S.view === 'party' && !S.party) || (S.view === 'cup' && !S.cup) ||
    (['names', 'partyCfg', 'teams'].includes(S.view) && !S.draft)) S.view = 'home';

const ui = { lastView: null, nowKey: null, reroll: false, modal: null };

/* ---------- Helfer ---------- */
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
function duration(games) {
  const m = games * MIN_PER_GAME;
  if (m < 60) return `≈ ${m} Min`;
  const h = Math.floor(m / 60), r = m % 60;
  return `≈ ${h} Std${r ? ` ${r} Min` : ''}`;
}
function duoHTML(names) { return `${esc(names[0])} <span class="amp">&amp;</span> ${esc(names[1])}`; }
function randomTeamNames(count, taken = []) {
  const pool = KL.shuffle(TEAM_NAMES.filter(n => !taken.includes(n)));
  const out = [];
  for (let i = 0; i < count; i++) out.push(pool[i] || `Team ${taken.length + i + 1}`);
  return out;
}

/* =========================================================
   Rendering
   ========================================================= */
function shell({ title = '', sub = '', left = null, right = null, body = '', action = '' }) {
  const lb = left ? `<button class="iconbtn" data-act="${left.act}" aria-label="${left.label}">${I[left.icon]}</button>` : '';
  const rb = right ? `<button class="iconbtn" data-act="${right.act}" aria-label="${right.label}">${I[right.icon]}</button>` : '';

    <main class="main"><div class="content">${body}</div></main>
    ${action ? `<div class="actionbar"><div class="inner">${action}</div></div>` : ''}`;
}

function render() {
  const app = $('#app');
  const prevMain = $('.main');
  const sameView = ui.lastView === S.view;
  const keep = sameView && prevMain ? {
    top: prevMain.scrollTop,
    lefts: [...document.querySelectorAll('.bk-scroll')].map(e => e.scrollLeft)
  } : null;

  let html;
  switch (S.view) {
    case 'names': html = viewNames(); break;
    case 'partyCfg': html = viewPartyCfg(); break;
    case 'teams': html = viewTeams(); break;
    case 'party': html = viewParty(); break;
    case 'cup': html = viewCup(); break;
    default: html = viewHome();
  }
  app.innerHTML = html;
  const main = $('.main');
  if (!sameView) { main.firstElementChild.classList.add('view-enter'); main.scrollTop = 0; }
  else if (keep) {
    main.scrollTop = keep.top;
    document.querySelectorAll('.bk-scroll').forEach((e, i) => { if (keep.lefts[i] != null) e.scrollLeft = keep.lefts[i]; });
  }
  const bar = $('.topbar');
  const onScroll = () => bar.classList.toggle('scrolled', main.scrollTop > 4);
  main.addEventListener('scroll', onScroll, { passive: true }); onScroll();

  ui.reroll = false;
}

function randomTeams() {

/* ---------- Turnier: Kontext ---------- */
const brCache = {};
function cupCtx() {
  const C = S.cup, T = C.teams.length;
  const br = brCache[T] || (brCache[T] = KL.cupBuild(T));
  const res = KL.cupResolve(br, C.seeds, C.results);
  const { info } = res;
  // strukturelle Freilose
  const sb = {};
  const structBye = (src) => {
    if (src.t === 'seed') return src.i >= T;
    if (src.m === 'GF' || src.m === 'GF2') return false;
    const m = br.M[src.m];
    const b1 = structBye(m.s1), b2 = structBye(m.s2);
    return src.t === 'win' ? (b1 && b2) : (b1 || b2);
  };
  const isAuto = (id) => {
    if (id in sb) return sb[id];
    const m = br.M[id];
    return (sb[id] = id !== 'GF' && id !== 'GF2' && (structBye(m.s1) || structBye(m.s2)));
  };
  // Labels G1.., V1..
  const label = {}; let g = 0, v = 0;
  for (const id of br.order) {
    if (isAuto(id)) continue;
    const m = br.M[id];
    if (m.br === 'W') label[id] = 'G' + (++g);
    else if (m.br === 'L') label[id] = 'V' + (++v);
    else label[id] = id === 'GF' ? 'Finale' : 'Entscheidung';
  }
  const tname = (t) => C.teams[t].name;
  const placeholder = (src) => {
    if (src.t === 'seed') return src.i < T ? tname(C.seeds[src.i]) : 'Freilos';
    const p = res.part(src);
    if (p !== null && p !== KL.BYE) return tname(p);
    if (isAuto(src.m) && src.t === 'win') {
      const m = br.M[src.m];
      return placeholder(structBye(m.s1) ? m.s2 : m.s1);
    }
    return (src.t === 'win' ? 'Sieger ' : 'Verlierer ') + (label[src.m] || '');
  };
  const lbRoundNo = {}; let lbn = 0;
  for (let q = 1; q <= br.LR; q++) if (br.order.some(id => br.M[id].br === 'L' && br.M[id].round === q && !isAuto(id))) lbRoundNo[q] = ++lbn;
  const stage = (id) => {
    const m = br.M[id];
    if (m.br === 'W') return m.round === br.n ? (br.n === 1 ? 'Erstes Duell' : 'Gewinner-Finale') : `Gewinner · Runde ${m.round}`;
    if (m.br === 'L') return m.round === br.LR ? 'Verlierer-Finale' : `Verlierer · Runde ${lbRoundNo[m.round]}`;
    return id === 'GF' ? 'Großes Finale' : 'Entscheidungsspiel';
  };
  // gültige Historie
  const hist = C.history.filter(id => info[id] && info[id].played);
  const lastId = hist[hist.length - 1];
  const lastTeams = lastId ? [info[lastId].a, info[lastId].b] : [];
  const cur = res.champ === null ? KL.cupPick(br, info, lastTeams) : null;
  const { losses, wins, games } = KL.cupLosses(br, info, T);
  const playedCount = br.order.filter(id => info[id].exists && info[id].played).length;
  return { C, T, br, info, res, champ: res.champ, isAuto, label, placeholder, stage, cur, losses, wins, games, playedCount, hist, structBye, tname };
}

// Joker: Wer setzt in diesem Spiel aus?
function jokerOptions(ctx, id) {
  const C = ctx.C;
  if (C.joker == null) return null;
  const it = ctx.info[id];
  const four = [...C.teams[it.a].m, ...C.teams[it.b].m];
  const sit = {}, teamJ = {};
  let lastTeam = null;
  for (const hid of ctx.hist) {
    const r = C.results[hid];
    if (r && r.sub != null) {
      sit[r.sub] = (sit[r.sub] || 0) + 1;
      const tm = C.teams.findIndex(t => t.m.includes(r.sub));
      teamJ[tm] = (teamJ[tm] || 0) + 1; lastTeam = tm;
    }
  }
  const hash = (p) => ((p + 1) * 2654435761 + id.length * 97 + id.charCodeAt(id.length - 1) * 31) % 1000 / 1000;
  const scored = four.map(p => {
    const tm = C.teams.findIndex(t => t.m.includes(p));
    return { p, s: (sit[p] || 0) * 10 + (teamJ[tm] || 0) * 3 + (tm === lastTeam ? 2 : 0) + hash(p) };
  }).sort((a, b) => a.s - b.s).map(x => x.p);
  return [...scored, null]; // null = Joker pausiert
}
function jokerSub(ctx, id) {
  const opts = jokerOptions(ctx, id);
  if (!opts) return undefined;
  const k = (ctx.C.jokerPick[id] || 0) % opts.length;
  return opts[k];
}

function cupNextPreview(ctx) {
  const { br, info, cur } = ctx;
  if (!cur) return null;
  const it = info[cur];
  const id2 = KL.cupPick(br, info, [it.a, it.b], cur);
  if (id2) return { id: id2, a: ctx.tname(info[id2].a), b: ctx.tname(info[id2].b) };
  const dep = (src) => {
    const p = ctx.res.part(src);
    if (p !== null) return p === KL.BYE ? null : ctx.tname(p);
    if (src.t === 'seed') return null;
    if (src.m === cur) return src.t === 'win' ? 'Sieger von jetzt' : 'Verlierer von jetzt';
    if (ctx.isAuto(src.m) && src.t === 'win') { const m = br.M[src.m]; return dep(ctx.structBye(m.s1) ? m.s2 : m.s1); }
    return null;
  };
  const ids = br.order.slice().sort((x, y) => br.M[x].key - br.M[y].key);
  for (const id of ids) {
    if (id === cur || id === 'GF2' || ctx.isAuto(id)) continue;
    const x = info[id];
    if (!x.exists || x.outcome) continue;
    const a = dep(br.M[id].s1), b = dep(br.M[id].s2);
    if (a && b) return { id, a, b, ph: true };
  }
  if (cur === 'GF') return { gf2: true, lb: ctx.tname(info.GF.b) };
  return null;
}

/* ---------- Turnier live ---------- */
function viewCup() {
  const ctx = cupCtx();
  const { C, info, cur } = ctx;
  const members = (t) => C.teams[t].m.map(i => C.players[i]);
  let left;
  if (ctx.champ !== null) {
    ui.nowKey = 'cdone';
    left = `<section class="now"><div class="top"><span class="live-dot">Fertig</span><span class="count">${ctx.playedCount} Spiele</span></div>
      <div class="eyebrow">Turniersieger</div>
      <h2 class="h-lg brass" style="margin-top:8px">${esc(ctx.tname(ctx.champ))}</h2>
      <p class="lead" style="margin-top:6px">${duoHTML(members(ctx.champ))}</p>
      <div class="cta"><button class="btn btn-primary btn-block" data-act="celebrate">Siegerehrung</button></div></section>`;
  } else if (cur) {
    const it = info[cur];
    const key = 'c' + cur; const swap = ui.nowKey !== key; ui.nowKey = key;
    let jline = '';
    if (C.joker != null) {
      const sub = jokerSub(ctx, cur);
      const jn = esc(C.players[C.joker]);
      jline = `<div class="jline"><span class="jbadge">JOKER</span>${sub == null ? `<span><b>${jn}</b> setzt dieses Spiel aus</span>` : `<span><b>${jn}</b> spielt für <b>${esc(C.players[sub])}</b></span>`}
        <button data-act="joker-swap" data-id="${cur}">Tauschen</button></div>`;
    }
    const mem = (t) => {
      const sub = C.joker != null ? jokerSub(ctx, cur) : null;
      return C.teams[t].m.map(i => i === sub ? `<span class="jk">${esc(C.players[C.joker])}</span>` : esc(C.players[i])).join(' &amp; ');
    };
    left = `<section class="now ${swap ? 'swap' : ''}">
      <div class="top"><span class="live-dot"><i></i>Jetzt spielt</span><span class="count">${esc(ctx.stage(cur))}</span></div>
      <div class="versus">
        <div class="side"><div class="who">${esc(ctx.tname(it.a))}</div><div class="sm">${mem(it.a)}</div></div>
        <div class="vs">VS</div>
        <div class="side r"><div class="who">${esc(ctx.tname(it.b))}</div><div class="sm">${mem(it.b)}</div></div>
      </div>
      ${jline}
      <div class="cta"><button class="btn btn-primary btn-block" data-act="cup-result" data-id="${cur}">Sieger eintragen</button></div>
    </section>`;
    const nx = cupNextPreview(ctx);
    if (nx && nx.gf2) left += `<section class="next"><div class="eyebrow">Danach</div><div class="muted">Gewinnt <b style="color:var(--text)">${esc(nx.lb)}</b>, haben beide Teams eine Niederlage. Dann entscheidet ein letztes Spiel.</div></section>`;
    else if (nx) left += `<section class="next"><div class="eyebrow">Als Nächstes · ${esc(ctx.stage(nx.id))}</div>
        <div class="row"><span class="${nx.ph && nx.a.endsWith('von jetzt') ? 'ph' : ''}">${esc(nx.a)}</span><span class="v">VS</span><span class="${nx.ph && nx.b.endsWith('von jetzt') ? 'ph' : ''}">${esc(nx.b)}</span></div></section>`;
    else left += `<section class="next"><div class="eyebrow">Letztes Spiel</div><div class="muted">Danach steht der Turniersieger fest.</div></section>`;
  } else {
    left = `<section class="now"><div class="muted">Kein Spiel bereit.</div></section>`;
  }

  const tab = S.tab.cup;
  const panel = tab === 'bracket' ? bracketHTML(ctx) : teamsListHTML(ctx);
  const body = `<div class="wrap live"><div class="left">${left}</div>
    <div class="right"><div class="tabs"><button class="tab ${tab === 'bracket' ? 'on' : ''}" data-act="tab" data-t="bracket">Bracket</button><button class="tab ${tab === 'teams' ? 'on' : ''}" data-act="tab" data-t="teams">Teams</button></div>${panel}</div></div>`;
  return shell({ title: 'Turnier', sub: `${ctx.playedCount} gespielt`, left: { act: 'go-home', icon: 'home', label: 'Start' }, right: { act: 'menu', icon: 'more', label: 'Menü' }, body });
}

function bracketCard(ctx, id) {
  const { br, info, C } = ctx;
  const it = info[id], m = br.M[id];
  const r = C.results[id];
  const row = (src, p) => {
    if (p === null || p === undefined) return `<div class="t ph"><span>${esc(ctx.placeholder(src))}</span></div>`;
    const cls = it.played ? (it.outcome.w === p ? 'win' : 'lose') : '';
    const g = r && it.played && r.ga != null ? (p === r.a ? r.ga : r.gb) : '';
    return `<div class="t ${cls}"><span>${esc(ctx.tname(p))}</span><span class="g">${g}</span></div>`;
  };
  const clickable = it.played || it.ready;
  return `<${clickable ? 'button' : 'div'} class="bm ${id === ctx.cur ? 'cur' : ''}" ${clickable ? `data-act="cup-result" data-id="${id}"` : ''}>
    <div class="lab"><span>${esc(ctx.label[id])}</span><span>${id === ctx.cur ? '<span class="brass">Jetzt</span>' : (it.played ? '' : '')}</span></div>
    ${row(m.s1, it.a)}${row(m.s2, it.b)}</${clickable ? 'button' : 'div'}>`;
}
function bracketHTML(ctx) {
  const { br, C, T } = ctx;
  const col = (title, ids, extra = '') => `<div class="bk-col"><h4>${esc(title)}</h4><div class="bk-cards">${extra}${ids.map(id => bracketCard(ctx, id)).join('')}</div></div>`;
  // Gewinner-Bracket
  let wb = '';
  for (let r = 1; r <= br.n; r++) {
    const ids = br.order.filter(id => br.M[id].br === 'W' && br.M[id].round === r && !ctx.isAuto(id));
    let extra = '';
    if (r === 1) {
      // Teams mit Freilos: Gegner-Setzplatz ist leer (>= T)
      const byeTeams = [];
      const so = KL.seeding(br.S);
      for (let i = 0; i < T; i++) {
        const pos = so.indexOf(i + 1), mate = so[pos % 2 ? pos - 1 : pos + 1] - 1;
        if (mate >= T) byeTeams.push(C.seeds[i]);
      }
      extra = byeTeams.map(t => `<div class="bm byes"><div class="lab"><span>Freilos</span></div><div class="t"><span>${esc(ctx.tname(t))}</span></div></div>`).join('');
    }
    if (ids.length || extra) wb += col(br.n === 1 ? 'Erstes Duell' : (r === br.n ? 'Finale' : `Runde ${r}`), ids, extra);
  }
  let lb = '', shown = 0;
  for (let q = 1; q <= br.LR; q++) {
    const ids = br.order.filter(id => br.M[id].br === 'L' && br.M[id].round === q && !ctx.isAuto(id));
    if (ids.length) lb += col(q === br.LR ? 'Finale' : `Runde ${++shown}`, ids);
  }
  const finals = ['GF'].concat(ctx.info.GF2.exists ? ['GF2'] : []);
  const fin = col('Großes Finale', finals);
  return `<div class="bk-sec"><div class="eyebrow">Gewinner-Bracket</div><div class="bk-scroll"><div class="bk">${wb}</div></div></div>
    ${lb ? `<div class="bk-sec"><div class="eyebrow">Verlierer-Bracket · 1 Niederlage</div><div class="bk-scroll"><div class="bk">${lb}</div></div></div>` : ''}
    <div class="bk-sec"><div class="eyebrow">Finale</div><div class="bk-scroll"><div class="bk">${fin}</div></div>
    <div class="muted" style="font-size:13px">Gewinnt im Finale das Team aus dem Verlierer-Bracket, haben beide eine Niederlage, dann gibt's ein Entscheidungsspiel. Tippe ein Spiel an, um ein Ergebnis zu ändern.</div></div>`;
}
function teamGoals(ctx) {
  const goals = new Array(ctx.T).fill(0); let any = false;
  for (const id of ctx.hist) {
    const r = ctx.C.results[id];
    if (r && r.ga != null) { any = true; goals[r.a] += r.ga; goals[r.b] += r.gb; }
  }
  return { goals, any };
}
function teamsListHTML(ctx) {
  const { C, T, losses, wins } = ctx;
  const { goals, any } = teamGoals(ctx);
  const order = [...Array(T).keys()].sort((a, b) => (a === ctx.champ ? -1 : b === ctx.champ ? 1 : 0) || losses[a] - losses[b] || wins[b] - wins[a]);
  const rows = order.map((t, i) => {
    const l = Math.min(2, losses[t]);
    const out = l >= 2;
    const pill = t === ctx.champ ? '<span class="pill w">Champion</span>' : out ? '<span class="pill out">Raus</span>' : l === 1 ? '<span class="pill l">Noch 1 Leben</span>' : '<span class="pill w">Ungeschlagen</span>';
    return `<div class="tl ${out ? 'out' : ''}" style="animation:pop .4s ${i * 30}ms both var(--ease)">
      <div class="nm">${esc(C.teams[t].name)}<small>${C.teams[t].m.map(p => esc(C.players[p])).join(' &amp; ')} · ${wins[t]} S · ${losses[t]} N${any ? ` · ${goals[t]} Tore` : ''}</small></div>
      <div class="st"><span class="lives"><i class="${l >= 2 ? 'gone' : ''}"></i><i class="${l >= 1 ? 'gone' : ''}"></i></span>${pill}</div></div>`;
  }).join('');
  let joker = '';
  if (C.joker != null) {
    const n = ctx.hist.filter(id => C.results[id] && C.results[id].sub != null).length;
    joker = `<div class="joker"><span class="jbadge">JOKER</span><div class="t"><b>${esc(C.players[C.joker])}</b>${plural(n, 'Einsatz', 'Einsätze')} bisher</div></div>`;
  }
  return `<div class="tlist">${rows}</div>${joker}<div class="muted" style="font-size:13px">Die Punkte zeigen die Leben: Jedes Team hat zwei.</div>`;
}

/* =========================================================
   Sheets & Dialoge
   ========================================================= */
function openSheet(html, onClose) {
  closeSheet(true);
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  scrim.addEventListener('click', (e) => { if (e.target === scrim) closeSheet(); });
  document.body.appendChild(scrim);
  ui.modal = { el: scrim, onClose };
  return scrim;
}
function closeSheet(instant) {
  const m = ui.modal;
  if (!m) return;
  ui.modal = null;
  if (m.onClose) m.onClose();
  if (instant) { m.el.remove(); return; }
  m.el.classList.add('closing'); m.el.firstElementChild.classList.add('closing');
  setTimeout(() => m.el.remove(), 220);
}
function ask({ title, text, ok = 'OK', danger = false }) {
  return new Promise(resolve => {
    let done = false;
    const finish = (v) => { if (done) return; done = true; resolve(v); };
    const el = openSheet(`<div class="head"><h3 class="h-md">${esc(title)}</h3></div>
      <p class="lead" style="margin:0">${text}</p>
      <div class="btns"><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-ask="1">${esc(ok)}</button><button class="btn btn-ghost" data-ask="0">Abbrechen</button></div>`, () => finish(false));
    el.querySelectorAll('[data-ask]').forEach(b => b.addEventListener('click', () => { finish(b.dataset.ask === '1'); closeSheet(); }));
  });
}

/* ---------- Ergebnis Punkte-Party ---------- */
function partyResultSheet(i) {
  const P = S.party, mt = P.matches[i];
  const r = P.results[i];
  const st = { ga: r ? r.ga : 0, gb: r ? r.gb : 0, saving: false };
  const nm = (p) => P.players[p];
  const el = openSheet(`<div class="head"><div><div class="eyebrow">Spiel ${i + 1}</div><h3 class="h-md" style="margin-top:6px">${r ? 'Ergebnis ändern' : 'Wie ist es ausgegangen?'}</h3></div>
      <button class="iconbtn" data-x aria-label="Schließen">${I.x}</button></div>
    <div class="score">
      ${['a', 'b'].map(s => `<div class="sc" id="sc-${s}"><div class="who"><span>${duoHTML(mt[s].map(nm))}</span></div>
        <div class="big num" id="big-${s}">${st['g' + s]}</div>
        <div class="pm2"><button data-d="-1" data-s="${s}" aria-label="Tor weniger">${I.minus}</button><button class="plus" data-d="1" data-s="${s}" aria-label="Tor mehr">${I.plus}</button></div></div>`).join('')}
    </div>
    <div class="btns"><button class="btn btn-primary" data-save>Speichern</button>
      ${r ? '<button class="btn btn-quiet" data-del>Ergebnis löschen</button>' : ''}</div>`);
  const upd = (s, bump) => {
    const b = $('#big-' + s, el); b.textContent = st['g' + s];
    if (bump) { b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
    $('#sc-a', el).classList.toggle('ahead', st.ga > st.gb);
    $('#sc-b', el).classList.toggle('ahead', st.gb > st.ga);
  };
  upd('a'); upd('b');
  el.querySelectorAll('.pm2 button').forEach(b => b.addEventListener('click', () => {
    const k = 'g' + b.dataset.s;
    st[k] = Math.max(0, Math.min(99, st[k] + Number(b.dataset.d)));
    upd(b.dataset.s, true);
  }));
  $('[data-x]', el).addEventListener('click', () => closeSheet());
  $('[data-save]', el).addEventListener('click', () => {
    if (st.saving) return; st.saving = true;
    const wasDone = partyState().cur === -1;
    P.results[i] = { ga: st.ga, gb: st.gb };
    save(); closeSheet(); render();
    if (!wasDone && partyState().cur === -1 && !S.celebrated.party) { S.celebrated.party = true; save(); setTimeout(celebrate, 450); }
  });
  const del = $('[data-del]', el);
  if (del) del.addEventListener('click', () => {
    if (st.saving) return; st.saving = true;
    delete P.results[i]; S.celebrated.party = false; save(); closeSheet(); render();
  });
}

/* ---------- Ergebnis Turnier ---------- */
function cupResultSheet(id) {
  const ctx = cupCtx();
  const { C, info } = ctx;
  const it = info[id];
  if (!it || !it.exists || (!it.ready && !it.played)) return;
  const r = C.results[id];
  const A = it.a, B = it.b;
  const st = {
    winner: r ? r.winner : null,
    ga: r && r.ga != null ? (r.a === A ? r.ga : r.gb) : 0,
    gb: r && r.ga != null ? (r.a === A ? r.gb : r.ga) : 0,
    goals: !!(r && r.ga != null), saving: false
  };
  const mem = (t) => C.teams[t].m.map(i => esc(C.players[i])).join(' &amp; ');
  const el = openSheet(`<div class="head"><div><div class="eyebrow">${esc(ctx.stage(id))}</div><h3 class="h-md" style="margin-top:6px">${r ? 'Ergebnis ändern' : 'Wer hat gewonnen?'}</h3></div>
      <button class="iconbtn" data-x aria-label="Schließen">${I.x}</button></div>
    <div class="pick">
      ${[A, B].map((t, k) => `<button class="pk" data-pick="${t}" id="pk-${k}"><span class="crown">${I.crown}</span><b>${esc(ctx.tname(t))}</b><small>${mem(t)}</small></button>`).join('')}
    </div>
    <details class="opt" ${st.goals ? 'open' : ''}><summary>${I.plus.replace('<svg', '<svg style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2"')} Tore eintragen (optional, nur Statistik)</summary>
      <div class="mini">${['a', 'b'].map(s => `<div class="ms"><button data-d="-1" data-s="${s}" aria-label="Tor weniger">${I.minus}</button><b class="num" id="g-${s}">${st['g' + s]}</b><button data-d="1" data-s="${s}" aria-label="Tor mehr">${I.plus}</button></div>`).join('')}</div>
    </details>
    <div class="btns"><button class="btn btn-primary" data-save ${st.winner == null ? 'disabled' : ''}>Speichern</button>
      ${r ? '<button class="btn btn-quiet" data-del>Ergebnis löschen</button>' : ''}</div>`);
  const sync = () => {
    [A, B].forEach((t, j) => {
      const on = st.winner === t;
      $('#pk-' + j, el).classList.toggle('on', on);
      $('#pk-' + j + ' small', el).innerHTML = on ? 'Gewinner' : mem(t);
    });
    $('#g-a', el).textContent = st.ga; $('#g-b', el).textContent = st.gb;
    $('[data-save]', el).disabled = st.winner == null;
  };
  sync();
  el.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => { st.winner = Number(b.dataset.pick); sync(); }));
  el.querySelectorAll('.ms button').forEach(b => b.addEventListener('click', () => {
    const k = 'g' + b.dataset.s;
    st[k] = Math.max(0, Math.min(99, st[k] + Number(b.dataset.d)));
    st.goals = true;
    if (st.ga !== st.gb) st.winner = st.ga > st.gb ? A : B;
    sync();
  }));
  $('[data-x]', el).addEventListener('click', () => closeSheet());

  const apply = async (newRes) => {
    const next = { ...C.results };
    if (newRes) next[id] = newRes; else delete next[id];
    const san = KL.cupSanitize(ctx.br, C.seeds, next);
    const lost = san.removed.filter(x => x !== id).length;
    if (lost > 0) {
      closeSheet(true);
      const okk = await ask({ title: 'Turnierverlauf ändert sich', text: `Dadurch passen ${plural(lost, 'spätere Partie', 'spätere Partien')} nicht mehr. Deren Ergebnisse werden gelöscht und neu ausgespielt.`, ok: 'Trotzdem ändern', danger: true });
      if (!okk) { render(); return; }
    } else closeSheet();
    const wasChamp = ctx.champ !== null;
    C.results = san.results;
    if (newRes && !C.history.includes(id)) C.history.push(id);
    C.history = C.history.filter(x => C.results[x]);
    if (!newRes) delete C.jokerPick[id];
    const after = cupCtx();
    if (after.champ === null) S.celebrated.cup = false;
    save(); render();
    if (!wasChamp && after.champ !== null && !S.celebrated.cup) { S.celebrated.cup = true; save(); setTimeout(celebrate, 450); }
  };
  $('[data-save]', el).addEventListener('click', () => {
    if (st.saving || st.winner == null) return; st.saving = true;
    const sub = r ? r.sub : (C.joker != null ? jokerSub(ctx, id) : undefined);
    apply({ a: A, b: B, winner: st.winner, ga: st.goals ? st.ga : null, gb: st.goals ? st.gb : null, sub: sub === undefined ? null : sub });
  });
  const del = $('[data-del]', el);
  if (del) del.addEventListener('click', () => { if (st.saving) return; st.saving = true; apply(null); });
}

/* ---------- Menü ---------- */
function menuSheet() {
  const canReroll = S.view === 'party' && partyState().done === 0;
  const el = openSheet(`<div class="head"><h3 class="h-md">Menü</h3><button class="iconbtn" data-x aria-label="Schließen">${I.x}</button></div>
    <div class="menu">
      <button class="btn btn-ghost" data-m="home">${I.home} Zur Startseite</button>
