<!DOCTYPE html>
<!--
  Momentum 1.1.1 · eine einzige Datei, keine Abhängigkeiten.

  Für spätere Updates (damit keine Daten verloren gehen):
  - Daten liegen in IndexedDB "momentum", Version 1. Stores: tasks, ideas, topics (Schlüssel id),
    journal, days (Schlüssel date, JJJJ-MM-TT), meta (Schlüssel key). Diese Namen und Schlüssel nicht ändern;
    neue Felder nur ergänzen. Ein neuer Store braucht eine höhere DB-Version mit onupgradeneeded.
  - Export/Import: JSON mit app "momentum", format 1, data { tasks, ideas, journal, topics, days }.
  - Die App läuft unter derselben Adresse weiter. Der Service Worker (sw.js) hält index.html, manifest.json
    und die Icons im Cache "momentum-cache-v1" und übernimmt eine neue index.html, sobald sie sich
    vom Cache unterscheidet und rel="manifest" enthält.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Momentum</title>
<meta name="momentum-build" content="1.1.1">
<meta name="description" content="Aufgaben, Ideen und Journal. Schnell rein, Kopf sortiert, wieder raus.">
<meta name="theme-color" content="#04070C">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Momentum">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* ============ Momentum ============ */
:root{
  color-scheme:dark;
  --bg:#04070C;
  --ink:#F1F6FB;
  --ink2:rgba(222,234,247,.66);
  --ink3:rgba(222,234,247,.5);
  --ink4:rgba(222,234,247,.2);
  --cyan:#62D9FF;
  --ice:#BDEFFF;
  --edge:rgba(170,228,255,.15);
  --edge2:rgba(150,228,255,.44);
  --glow:rgba(98,217,255,.36);
  --warn:#FFB8A1;
  --danger:#FF7F8A;
  --sheet:rgba(14,20,31,.8);
  --r:22px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --kb:0px;
  --vvh:100vh;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.3,1.18,.4,1);
  --spring-d:.5s;
  --pop:cubic-bezier(.3,1.5,.5,1);
  --pop-d:.42s;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Inter",system-ui,sans-serif;
}
@supports (transition-timing-function:linear(0,1)){:root{--spring:linear(0,0.038,0.115,0.221,0.329,0.444,0.551,0.641,0.725,0.795,0.849,0.895,0.93,0.957,0.977,0.991,1.001,1.007,1.011,1.012,1.013,1.012,1.011,1.01,1.008,1.007,1.006,1.004,1.003,1.003,1.002,1.001,1.001,1.001,1,1,1);--spring-d:0.60s;--pop:linear(0,0.075,0.234,0.428,0.619,0.786,0.917,1.01,1.067,1.095,1.101,1.093,1.077,1.057,1.038,1.021,1.008,0.999,0.993,0.99,0.99,0.991,0.992,0.994,0.996,0.998,0.999,1,1.001,1.001,1.001,1.001,1.001,1.001,1,1,1);--pop-d:0.68s}}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  position:fixed;inset:0;margin:0;overflow:hidden;overscroll-behavior:none;
  background:var(--bg);color:var(--ink);
  font-family:var(--font);font-size:17px;line-height:22px;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0;margin:0;padding:0;border-radius:0;-webkit-appearance:none;appearance:none}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;text-align:inherit}
input,textarea{-webkit-user-select:text;user-select:text;caret-color:var(--cyan)}
textarea{resize:none;display:block;width:100%}
::placeholder{color:var(--ink3);opacity:1}
::selection{background:rgba(98,217,255,.3)}
:focus{outline:0}
svg{display:block}
.ic{display:inline-grid;place-items:center;width:24px;height:24px;flex:none}
.ic svg{width:100%;height:100%}

/* ---------- Hintergrund ---------- */
#ambient{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(95% 44% at 0% 0%,rgba(44,150,216,.27) 0%,rgba(44,150,216,.08) 46%,transparent 74%),
    radial-gradient(70% 38% at 108% 36%,rgba(96,98,238,.15) 0%,transparent 70%),
    radial-gradient(120% 42% at 50% 112%,rgba(28,170,214,.13) 0%,transparent 70%),
    linear-gradient(180deg,#060A12 0%,#04070C 42%,#03050A 100%);
}
#ambient::before,#ambient::after{
  content:"";position:absolute;border-radius:50%;
  border:1px solid rgba(140,224,255,.075);
}
#ambient::before{width:500px;height:500px;right:-310px;top:-290px}
#ambient::after{width:320px;height:320px;right:-220px;top:-200px;border-color:rgba(140,224,255,.06)}

/* ---------- App-Rahmen ---------- */
#app{
  position:absolute;inset:0;z-index:1;
  transform-origin:50% 42%;
  transition:transform var(--spring-d) var(--spring),opacity .35s ease;
}
body:not(.ready) #app{opacity:0}
body.layered #app{transform:scale(.945)}
.view{
  position:absolute;inset:0;
  opacity:0;visibility:hidden;pointer-events:none;
  transform:translate3d(0,8px,0);
  transition:opacity .2s ease,transform .38s var(--ease),visibility 0s .2s;
}
.view.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition:opacity .24s ease,transform .38s var(--ease),visibility 0s}
.view::before,.view::after{content:"";position:absolute;left:0;right:0;z-index:4;pointer-events:none}
.view::before{top:0;height:calc(var(--sat) + 10px);background:linear-gradient(180deg,rgba(5,9,16,.94) 35%,rgba(5,9,16,0))}
.view::after{bottom:0;height:calc(var(--sab) + 116px);background:linear-gradient(0deg,#03050A 0,#03050A 24%,rgba(3,5,10,.86) 46%,rgba(3,5,10,.5) 72%,rgba(3,5,10,0))}
body.kb-open .view::after{display:none}
.scroll{
  position:absolute;left:0;right:0;top:0;bottom:var(--kb);
  overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none;
}
.scroll::-webkit-scrollbar{display:none}
.inner{
  min-height:calc(100% + 1px);max-width:560px;margin:0 auto;
  padding:calc(var(--sat) + 20px) max(20px,env(safe-area-inset-right,0px)) calc(var(--sab) + 132px) max(20px,env(safe-area-inset-left,0px));
}
body.kb-open .inner{padding-bottom:32px}

/* ---------- Kopf ---------- */
.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hero h1{font-size:36px;line-height:42px;padding-bottom:2px;font-weight:700;letter-spacing:-.026em;color:#F4FAFF;background:linear-gradient(176deg,#FFFFFF 34%,#BDEBFF 96%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{margin-top:0;font-size:17px;line-height:22px;color:var(--ink2)}
/* Jeder Bereich hat seine Lichtfarbe (--tc) und seine Stelle auf der Linie (--pos). Blau bleibt die Grundfarbe. */
#v-today{--tc:98,217,255;--tl:#BDEBFF;--pos:0}
#v-tasks{--tc:150,132,255;--tl:#D6CEFF;--pos:.333}
#v-ideas{--tc:255,190,98;--tl:#FFE2B5;--pos:.667}
#v-journal{--tc:96,236,190;--tl:#BDF8E4;--pos:1}
.hero h1{background-image:linear-gradient(176deg,#FFFFFF 34%,var(--tl) 96%)}

/* Lichtlinie = Tagesbilanz: blau erledigt, matt offen, rot überfällig */
.beam{position:relative;height:1px;margin:18px 0 24px;--a:0%;--o:0%;overflow-x:clip}
.beam > i{position:absolute;display:block}
.b-track{inset:0;background:linear-gradient(90deg,rgba(150,215,255,.16),rgba(150,215,255,.11) 70%,rgba(150,215,255,.05))}
.b-done{left:0;top:0;height:1px;width:var(--a);background:linear-gradient(90deg,#9BE8FF,#62D9FF);box-shadow:0 0 6px rgba(98,217,255,.9),0 0 14px rgba(98,217,255,.4);transition:width .9s var(--ease)}
.b-over{right:0;top:-.5px;height:2px;width:var(--o);border-radius:1px;background:linear-gradient(90deg,#FF7083,#FF3E56);box-shadow:0 0 7px rgba(255,62,86,.95),0 0 18px rgba(255,62,86,.45);transition:width .9s var(--ease)}
.beam.calm .b-done,.beam.calm .b-over{width:0}
.b-c{inset:0;pointer-events:none;transform:translateX(calc(var(--pos) * (100% - 4px)))}
.b-light{position:absolute;top:-.5px;left:2px;width:260px;height:2px;margin-left:-130px;border-radius:2px;background:radial-gradient(50% 50% at 50% 50%,rgba(var(--tc),.95),rgba(var(--tc),.35) 45%,rgba(var(--tc),0) 100%);box-shadow:0 0 0 0 transparent}
.b-light::after{content:"";position:absolute;left:25%;right:25%;top:-5px;bottom:-5px;border-radius:50%;background:radial-gradient(50% 50% at 50% 50%,rgba(var(--tc),.32),rgba(var(--tc),0));filter:blur(3px)}
.b-dot{position:absolute;left:0;top:-1.5px;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(var(--tc),1),0 0 14px 3px rgba(var(--tc),.55)}
.b-cap{position:absolute;right:0;top:8px;font-size:12px;line-height:15px;font-weight:500;letter-spacing:.01em;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap;transition:opacity .4s ease}
.b-cap b{font-weight:600;color:var(--ice)}
.b-cap em{font-style:normal;font-weight:600;color:#FF6B7D}
.beam.calm .b-cap{opacity:0}
body.ready:not(.intro) .view.active .beam,body.enter .view.active .beam{animation:beam 1.1s cubic-bezier(.2,.8,.2,1) both}
body.ready:not(.intro) .view.active .b-dot,body.enter .view.active .b-dot{animation:spark 1.1s cubic-bezier(.2,.8,.2,1) both,breathe 5.2s 1.1s ease-in-out infinite}
body.ready .view.active .b-light{animation:sway 6.4s 1.1s ease-in-out infinite}
body.ready .view.active .b-over{animation:redglow 2.6s ease-in-out infinite}
@keyframes beam{
  from{clip-path:inset(-48px calc((1 - var(--pos)) * 100% - 2px) -48px calc(var(--pos) * 100% - 2px))}
  to{clip-path:inset(-48px -14px -48px -14px)}
}
@keyframes spark{0%{transform:scale(.2);opacity:0}35%{transform:scale(1.8);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.85}}
@keyframes sway{0%,100%{transform:translateX(0) scaleX(1);opacity:.9}30%{transform:translateX(9px) scaleX(1.12);opacity:1}65%{transform:translateX(-7px) scaleX(.9);opacity:.72}}
@keyframes redglow{0%,100%{opacity:1}50%{opacity:.62}}

/* Hintergrund je Bereich: Aufgaben bekommt ein eigenes Hologramm */
.vbg{position:absolute;inset:0;z-index:0;pointer-events:none}
.view > .scroll{z-index:1}
#v-tasks .vbg{
  background:
    radial-gradient(80% 40% at 104% 2%,rgba(132,112,255,.22) 0%,rgba(132,112,255,.06) 50%,transparent 76%),
    radial-gradient(60% 30% at -6% 30%,rgba(70,140,255,.08),transparent 70%),
    repeating-linear-gradient(0deg,rgba(176,166,255,.05) 0 1px,transparent 1px 5px);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.6) 32%,rgba(0,0,0,.12) 60%,transparent 85%);
  mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.6) 32%,rgba(0,0,0,.12) 60%,transparent 85%);
}
#v-tasks .vbg::before{content:"";position:absolute;width:420px;height:420px;right:-250px;top:-170px;border-radius:50%;border:1px solid rgba(170,156,255,.12);box-shadow:inset 0 0 40px rgba(132,112,255,.05)}
#v-ideas .vbg{background:radial-gradient(70% 34% at 92% 6%,rgba(255,176,80,.11),transparent 72%),radial-gradient(60% 26% at 0% 60%,rgba(255,190,98,.04),transparent 70%)}
#v-journal .vbg{background:radial-gradient(76% 34% at 96% 4%,rgba(80,230,180,.10),transparent 72%)}
.icon-btn{
  width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--ink2);
  background:rgba(200,230,255,.06);border:.5px solid var(--edge);
  transition:transform .2s var(--ease),background .2s;
}
.icon-btn:active{transform:scale(.92);background:rgba(200,230,255,.12)}

/* ---------- Glas ---------- */
.glass{
  background:linear-gradient(180deg,rgba(200,230,255,.085),rgba(200,230,255,.034));
  border:.5px solid var(--edge);border-radius:var(--r);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.1),0 14px 34px rgba(0,0,0,.3);
}
.holo{position:relative;border-color:transparent}
.holo::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(140deg,rgba(160,236,255,.85),rgba(160,236,255,.1) 28%,rgba(150,160,255,.06) 62%,rgba(170,160,255,.5));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}

/* ---------- Abschnitte und Zeilen ---------- */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:0 4px 10px;font-size:15px;line-height:20px;font-weight:600;color:var(--ink2)}
.sec-h .n{font-weight:400;color:var(--ink3);font-variant-numeric:tabular-nums}
.sec-h.now-h{color:var(--ice)}
.sec-h.over-h{color:#FF6B7D}
.group{overflow:hidden}
.rw{position:relative;overflow:hidden;touch-action:pan-y}
.rw + .rw::before{content:"";position:absolute;left:58px;right:0;top:0;height:.5px;background:rgba(190,226,255,.11);z-index:2}
.rw-under{
  position:absolute;inset:0;display:flex;align-items:center;padding-left:17px;color:var(--ice);opacity:0;
  background:linear-gradient(90deg,rgba(98,217,255,.26),rgba(98,217,255,.06) 62%,transparent);
}
.rw-under .ic{transform:scale(.7);transition:transform var(--pop-d) var(--pop)}
.rw.armed .rw-under .ic{transform:scale(1.12);filter:drop-shadow(0 0 8px var(--glow))}
.row{position:relative;display:flex;align-items:stretch;min-height:60px}
.rw.swiping .row{will-change:transform}
.check{flex:0 0 58px;display:grid;place-items:center;min-height:56px}
.check i{
  position:relative;display:grid;place-items:center;width:25px;height:25px;border-radius:50%;
  border:1.5px solid rgba(214,234,250,.4);
  transition:background .22s ease,border-color .22s ease,box-shadow .3s ease,transform var(--pop-d) var(--pop);
}
.check svg{width:15px;height:15px;stroke:#04131C;stroke-width:2.4;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s .06s var(--ease)}
.check:active i{transform:scale(.86)}
/* Kreise nach Priorität: Hoch eisblau leuchtend, Normal strahlend weiß, Niedrig zurückhaltend */
.p2 .check i{border-color:var(--cyan);box-shadow:0 0 10px rgba(98,217,255,.4),inset 0 0 7px rgba(98,217,255,.22)}
.p1 .check i{border-color:rgba(255,255,255,.94);box-shadow:0 0 7px rgba(255,255,255,.3),inset 0 0 5px rgba(255,255,255,.12)}
.p0 .check i{border-color:rgba(214,234,250,.4)}
/* Überfällig: rot, klar gestuft. Ziel > Hoch > Normal > Niedrig */
.od:not(.is-done) .check i{border-color:#FF6676;box-shadow:0 0 6px rgba(255,90,110,.28)}
.od.p2:not(.is-done) .check i{border-width:2px;border-color:#FF3B55;box-shadow:0 0 14px rgba(255,52,80,.8),0 0 3px rgba(255,52,80,.95),inset 0 0 9px rgba(255,52,80,.38);animation:alarm 2.2s ease-in-out infinite}
.od.p0:not(.is-done) .check i{border-color:rgba(255,120,136,.42);box-shadow:none}
.od.p0 .row-title{color:rgba(240,214,220,.6)}
.od.p2:not(.is-done) .row-title{font-weight:600;color:#FFF3F5}
.od.p2:not(.tp-on):not(.is-done) .row{background:linear-gradient(90deg,rgba(255,52,80,.16),rgba(255,52,80,.04) 60%,transparent)}
.od.p2:not(.tp-on):not(.is-done) .row::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#FF4D66;box-shadow:0 0 10px rgba(255,52,80,.9)}
@keyframes alarm{0%,100%{box-shadow:0 0 14px rgba(255,52,80,.8),0 0 3px rgba(255,52,80,.95),inset 0 0 9px rgba(255,52,80,.38)}50%{box-shadow:0 0 22px rgba(255,52,80,.95),0 0 5px rgba(255,52,80,1),inset 0 0 11px rgba(255,52,80,.5)}}
.od .row-meta .hot{color:#FF8494;font-weight:600}
.group.over-g{border-color:rgba(255,84,104,.5);background:linear-gradient(180deg,rgba(255,70,92,.09),rgba(255,70,92,.03));box-shadow:inset 0 .5px 0 rgba(255,170,180,.14),0 0 22px rgba(255,60,84,.13),0 14px 34px rgba(0,0,0,.3)}
.group.over-g .rw + .rw::before{background:rgba(255,150,165,.13)}
.is-done .check i{background:linear-gradient(160deg,#D2F5FF,#5FD6FF);border-color:#9BE7FF;box-shadow:0 0 16px var(--glow)}
.is-done .check svg{stroke-dashoffset:0}
.pop .check i::after{
  content:"";position:absolute;inset:-1.5px;border-radius:50%;border:1.5px solid var(--cyan);
  animation:pulse .55s var(--ease) forwards;
}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(2.3);opacity:0}}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:11px 16px 11px 0}
.row-title{
  font-size:17px;line-height:22px;letter-spacing:-.011em;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;
  transition:color .3s ease;
}
.p0 .row-title{color:var(--ink2)}
.rw.flat .row-title,.idea-text{white-space:pre-line}
.is-done .row-title{color:var(--ink3);text-decoration:line-through;text-decoration-color:rgba(98,217,255,.45)}
.row-meta{display:flex;flex-wrap:wrap;align-items:center;column-gap:12px;font-size:13px;line-height:18px;color:var(--ink3)}
.row-meta .over{color:#FF6B7D}
.row-meta .hot{color:var(--cyan)}
.tp{display:inline-flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;flex:none;border-radius:50%;background:hsl(var(--h) 88% 74%);box-shadow:0 0 7px hsl(var(--h) 92% 66% / .7)}
/* Zeilen mit Thema tragen dessen Farbe */
.tp-on .row{background:linear-gradient(90deg,hsl(var(--h) 85% 62% / .16),hsl(var(--h) 85% 62% / .06) 55%,hsl(var(--h) 85% 62% / .025))}
.tp-on .row::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:hsl(var(--h) 90% 72%);box-shadow:0 0 9px hsl(var(--h) 95% 62% / .75)}
.tp-on.is-done .row{background:linear-gradient(90deg,hsl(var(--h) 85% 62% / .07),transparent 60%)}
.tp-on.is-done .row::before{opacity:.45}
.tp-on .tp{color:hsl(var(--h) 70% 82%)}
.idea-card.tp-on{background:linear-gradient(100deg,hsl(var(--h) 85% 62% / .15),hsl(var(--h) 85% 62% / .04) 60%,rgba(200,230,255,.03));border-color:hsl(var(--h) 85% 70% / .3)}
.row-chev{flex:none;align-self:center;margin-right:12px;width:18px;height:18px;color:var(--ink4)}
/* Neu angelegtes leuchtet einmal kurz auf */
.rw.fresh{animation:fresh 1.4s ease-out .12s both}
@keyframes fresh{0%{background:rgba(98,217,255,.2)}100%{background:rgba(98,217,255,0)}}
.rw.flat + .rw.flat::before{left:18px}
.rw.flat .row{width:100%}
.rw.flat .row-main{padding-left:18px}
.rw.flat .row:active,.rw.flat .jitem:active{background:rgba(200,230,255,.05)}

/* Details unter einer Aufgabe / einem Ziel (Heute): klappen weich auf */
.rw-det,.goal-det{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .42s var(--ease),opacity .28s ease}
.rw-det > div,.goal-det > div{min-height:0;overflow:hidden}
.rw-det{position:relative;z-index:1}
.rw.open .rw-det,.goal.open + .goal-det{grid-template-rows:1fr;opacity:1}
.rw-det-in{padding:0 16px 12px 58px;display:flex;flex-direction:column;gap:6px}
.goal-det .rw-det-in{padding:0 0 12px 44px}
.det-note{font-size:15px;line-height:21px;color:var(--ink2);white-space:pre-line;overflow-wrap:anywhere;padding-left:10px;border-left:1.5px solid rgba(150,228,255,.32)}
.det-none{font-size:14px;line-height:19px;color:var(--ink3)}
.det-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px}
.det-time{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ice)}
.det-time .ic{width:16px;height:16px}
.det-foot .det-edit{flex:none;padding:0 18px}
.row-meta .tm{color:var(--ice);font-variant-numeric:tabular-nums}
.row-meta .moved{color:#FF6B7D;font-weight:600}
.has-det{display:inline-flex;vertical-align:middle;color:var(--ink3)}
.has-det .ic{width:15px;height:15px}
.goal-text .has-det{margin-left:8px}
.rw.open .row-main .row-title{-webkit-line-clamp:unset}
.e-detail{margin:12px 2px 0;padding:12px 14px;border-radius:16px;background:rgba(200,230,255,.05);border:.5px solid var(--edge);font-size:16px;line-height:22px}
.e-detail.grow::after,.e-detail.grow > textarea{max-height:110px}
.e-detail.grow > textarea{overflow-y:auto;scrollbar-width:none}
#note-grow{margin-top:0;min-height:96px}
#note-grow.grow::after,#note-grow.grow > textarea{max-height:220px}

/* ---------- Aufgaben: Zeit-Übersicht (violettes Hologramm) ---------- */
.ti-list{display:flex;flex-direction:column;gap:8px}
.ti{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px 10px 16px;border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,rgba(186,176,255,.085),rgba(186,176,255,.03));border:.5px solid rgba(190,180,255,.17);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.08),0 10px 26px rgba(0,0,0,.26);
  transition:transform .2s var(--ease),background .2s ease;
}
.ti:active{transform:scale(.985);background:rgba(186,176,255,.12)}
.ti::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:rgba(200,190,255,.5)}
.ti.p2::before{background:#B9AEFF;box-shadow:0 0 10px rgba(150,132,255,.9)}
.ti.p0::before{background:rgba(200,190,255,.22)}
.ti.tp-on{background:linear-gradient(100deg,hsl(var(--h) 85% 62% / .15),hsl(var(--h) 85% 62% / .04) 60%,rgba(186,176,255,.03));border-color:hsl(var(--h) 80% 72% / .26)}
.ti.tp-on::before{background:hsl(var(--h) 90% 72%);box-shadow:0 0 9px hsl(var(--h) 95% 62% / .75)}
.ti-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ti .row-title{-webkit-line-clamp:2}
.ti-time{flex:none;align-self:flex-start;margin-top:2px;font-size:13px;line-height:18px;font-weight:600;color:#D6CEFF;font-variant-numeric:tabular-nums}
.ti.od{border-color:rgba(255,84,104,.45);background:linear-gradient(100deg,rgba(255,60,84,.16),rgba(255,60,84,.04) 70%);box-shadow:0 0 18px rgba(255,60,84,.12),0 10px 26px rgba(0,0,0,.26)}
.ti.od::before{background:#FF4D66;box-shadow:0 0 10px rgba(255,52,80,.9)}
.ti.od.p2 .row-title{font-weight:600;color:#FFF3F5}
.ti.is-done{opacity:.62}
.ti.is-done .row-title{color:var(--ink3);text-decoration:line-through;text-decoration-color:rgba(170,156,255,.5)}
.ti.fresh{animation:tifresh 1.4s ease-out .12s both}
@keyframes tifresh{0%{box-shadow:0 0 0 1px rgba(200,190,255,.7),0 0 26px rgba(150,132,255,.5)}100%{box-shadow:0 0 0 0 transparent,0 10px 26px rgba(0,0,0,.26)}}
.over-s .ti-list{gap:6px}

/* Wochenband: jeder Tag mit Lichtbalken nach Last */
.plan-s{margin-top:22px}
.wband{margin:0 -20px}
.wb-days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior:contain;padding:4px 20px 6px;scroll-snap-type:x proximity}
.wb-days::-webkit-scrollbar{display:none}
.wb-day{
  position:relative;flex:none;width:52px;height:84px;border-radius:18px;scroll-snap-align:start;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:9px;gap:2px;
  background:rgba(186,176,255,.05);border:.5px solid rgba(190,180,255,.14);color:var(--ink2);
  transition:background .25s ease,border-color .25s ease,box-shadow .3s ease,transform .2s var(--ease);
}
.wb-day:active{transform:scale(.94)}
.wb-w{font-size:12px;line-height:15px;font-weight:600;letter-spacing:.02em;color:var(--ink3)}
.wb-day.today .wb-w{color:#D6CEFF}
.wb-n{font-size:20px;line-height:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wb-bar{position:relative;display:block;width:26px;height:3px;margin-top:6px;border-radius:2px;background:rgba(200,190,255,.12);overflow:hidden}
.wb-bar > i{position:absolute;left:0;top:0;bottom:0;width:calc(var(--l) * 100%);border-radius:2px;background:linear-gradient(90deg,#A99BFF,#D6CEFF);box-shadow:0 0 8px rgba(150,132,255,.9)}
.wb-day.hot .wb-bar > i{background:linear-gradient(90deg,#8FDFFF,#D6CEFF)}
.wb-c{font-size:11px;line-height:14px;color:var(--ink3);font-variant-numeric:tabular-nums;min-height:14px}
.wb-day.on{background:linear-gradient(180deg,rgba(170,156,255,.26),rgba(170,156,255,.08));border-color:rgba(206,196,255,.7);color:#fff;box-shadow:0 0 22px rgba(150,132,255,.3),inset 0 0 14px rgba(170,156,255,.18)}
.wb-day.on .wb-w{color:#E6E0FF}

/* Gewählter Tag */
.dayv{margin-top:16px}
.dv-head{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:10px;row-gap:2px;margin:0 4px 12px}
.dv-head h2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.02em}
.dv-date{font-size:15px;color:var(--ink2)}
.dv-sum{flex-basis:100%;font-size:13px;line-height:18px;color:#CFC6FF}
.dv-free{margin-bottom:14px}
.dv-sub{display:flex;align-items:baseline;gap:8px;margin:0 4px 8px;font-size:13px;line-height:18px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink3)}
.dv-sub .n{font-weight:400}
.dv-empty{padding:18px 4px 4px;font-size:15px;line-height:21px;color:var(--ink3)}

/* Zeitstrahl */
.tl{position:relative;margin:4px 0 0;border-radius:22px;padding:0}
.tl-h{position:absolute;left:0;right:0;height:0;border-top:.5px solid rgba(190,180,255,.13)}
.tl-h span{position:absolute;left:4px;top:-8px;font-size:11px;line-height:16px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums;background:var(--bg);padding-right:6px;border-radius:4px}
.tl-h.past span{color:rgba(222,234,247,.28)}
.tl-col{position:absolute;left:34px;right:0;top:0;bottom:0}
.tl-b{
  position:absolute;top:var(--y);height:var(--bh);left:calc(var(--lane) * (100% / var(--n)));width:calc(100% / var(--n) - 4px);
  display:flex;flex-direction:column;justify-content:flex-start;gap:1px;padding:6px 10px 6px 12px;border-radius:12px;overflow:hidden;text-align:left;
  background:linear-gradient(180deg,rgba(170,156,255,.24),rgba(170,156,255,.1));border:.5px solid rgba(206,196,255,.4);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.12),0 6px 18px rgba(0,0,0,.3);
  transition:transform .2s var(--ease),opacity .3s ease;
}
.tl-b::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:#B9AEFF;box-shadow:0 0 9px rgba(150,132,255,.9)}
.tl-b:active{transform:scale(.98)}
.tl-b.tp-on{background:linear-gradient(180deg,hsl(var(--h) 80% 62% / .3),hsl(var(--h) 80% 62% / .1));border-color:hsl(var(--h) 85% 74% / .45)}
.tl-b.tp-on::before{background:hsl(var(--h) 90% 72%);box-shadow:0 0 9px hsl(var(--h) 95% 62% / .8)}
.tl-b.p2{border-color:rgba(214,206,255,.75);box-shadow:0 0 18px rgba(150,132,255,.32),0 6px 18px rgba(0,0,0,.3)}
.tl-b.p0{opacity:.8}
.tl-t{font-size:15px;line-height:19px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-m{font-size:12px;line-height:16px;color:rgba(230,224,255,.75);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-b.short{flex-direction:row;align-items:center;gap:8px;padding-top:0;padding-bottom:0}
.tl-b.short .tl-m{flex:none}
.tl-b.past{opacity:.5;filter:saturate(.6)}
.tl-b.live{border-color:rgba(230,224,255,.95);box-shadow:0 0 0 1px rgba(214,206,255,.35),0 0 26px rgba(150,132,255,.5)}
.tl-b.is-done{opacity:.42}
.tl-b.is-done .tl-t{text-decoration:line-through;text-decoration-color:rgba(214,206,255,.7)}
.tl-now{position:absolute;left:30px;right:0;height:0;z-index:2;pointer-events:none;border-top:1.5px solid #E6E0FF;box-shadow:0 0 8px rgba(170,156,255,.95),0 0 18px rgba(150,132,255,.5)}
.tl-now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px rgba(170,156,255,.95)}
.tl-now span{position:absolute;right:0;top:-19px;font-size:11px;line-height:14px;font-weight:700;color:#E6E0FF;font-variant-numeric:tabular-nums}

/* Danach: kommende Tage */
.ag-day + .ag-day{margin-top:16px}
.ag-h{display:flex;align-items:baseline;gap:8px;margin:0 4px 8px;font-size:15px;line-height:20px}
.ag-h b{font-weight:600;color:#D6CEFF}
.ag-h span{font-size:13px;color:var(--ink3)}

/* ---------- Tagesziele ---------- */
.goals{padding:8px 18px 10px;border-radius:26px;background:linear-gradient(165deg,rgba(150,222,255,.13),rgba(150,190,255,.04) 55%,rgba(160,160,255,.07));box-shadow:inset 0 .5px 0 rgba(255,255,255,.14),0 18px 44px rgba(0,0,0,.36),0 0 44px rgba(70,190,255,.07)}
.goals::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(118deg,rgba(190,240,255,0) 26%,rgba(190,240,255,.055) 43%,rgba(190,240,255,0) 58%)}
.goals > *{position:relative;z-index:1}
.goals-head{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.goals-head h2{font-size:15px;line-height:20px;font-weight:600;color:var(--ink2)}
.link{min-height:44px;padding:0 2px;display:inline-flex;align-items:center;gap:4px;color:var(--ice);font-size:15px;font-weight:600;transition:opacity .2s}
.link:active{opacity:.55}
.goal{display:flex;align-items:center;min-height:54px}
.goal + .goal,.goal-det + .goal{border-top:.5px solid rgba(190,226,255,.11)}
.goal .check{flex:0 0 44px;justify-items:start;min-height:54px}
.goal:not(.is-done) .check i{border-color:var(--cyan);box-shadow:0 0 10px rgba(98,217,255,.36),inset 0 0 7px rgba(98,217,255,.2)}
.goal-text{flex:1;min-width:0;padding:12px 0;font-size:19px;line-height:25px;font-weight:500;letter-spacing:-.014em;overflow-wrap:anywhere;transition:color .3s ease}
.goal.is-done .goal-text{color:var(--ink3);text-decoration:line-through;text-decoration-color:rgba(98,217,255,.45)}
.goals-empty{padding:2px 0 12px}
.goals-empty p{font-size:19px;line-height:26px;font-weight:500;letter-spacing:-.014em;color:var(--ink);margin-bottom:16px}
/* Überfällige Tagesziele: oberste Stufe. Eigenes Feld, stärkstes Rot, doppelter Ring. */
.ogoals{position:relative;margin-top:12px;padding:4px 18px 6px;border-radius:24px;
  background:linear-gradient(165deg,rgba(255,52,84,.2),rgba(255,52,84,.06) 55%,rgba(255,80,150,.1));
  box-shadow:inset 0 .5px 0 rgba(255,200,210,.18),0 0 34px rgba(255,40,72,.2),0 16px 40px rgba(0,0,0,.36);
  animation:og-glow 2.8s ease-in-out infinite}
.ogoals::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,120,140,.95),rgba(255,80,100,.16) 30%,rgba(255,60,120,.08) 62%,rgba(255,110,170,.6));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.ogoals > *{position:relative;z-index:1}
.sec > .ogoals{margin-top:0}
@keyframes og-glow{0%,100%{box-shadow:inset 0 .5px 0 rgba(255,200,210,.18),0 0 30px rgba(255,40,72,.16),0 16px 40px rgba(0,0,0,.36)}50%{box-shadow:inset 0 .5px 0 rgba(255,200,210,.24),0 0 44px rgba(255,40,72,.32),0 16px 40px rgba(0,0,0,.36)}}
.ogoals-head{display:flex;align-items:baseline;gap:8px;min-height:40px;padding-top:12px}
.ogoals-head h2{font-size:15px;line-height:20px;font-weight:700;color:#FF7486;letter-spacing:.01em}
.ogoals-head .n{font-size:15px;color:rgba(255,150,165,.7);font-variant-numeric:tabular-nums}
.og + .og{border-top-color:rgba(255,150,165,.14)}
.og .check{flex:0 0 46px}
.og:not(.is-done) .check i{width:26px;height:26px;border-width:3px;border-color:#FF2D55;
  box-shadow:0 0 0 3.5px rgba(255,45,85,.16),0 0 18px rgba(255,40,80,.9),0 0 4px rgba(255,40,80,1),inset 0 0 10px rgba(255,40,80,.45);animation:og-alarm 1.8s ease-in-out infinite}
@keyframes og-alarm{0%,100%{box-shadow:0 0 0 3.5px rgba(255,45,85,.16),0 0 18px rgba(255,40,80,.9),0 0 4px rgba(255,40,80,1),inset 0 0 10px rgba(255,40,80,.45)}50%{box-shadow:0 0 0 6px rgba(255,45,85,.1),0 0 28px rgba(255,40,80,1),0 0 6px rgba(255,40,80,1),inset 0 0 12px rgba(255,40,80,.6)}}
.og .goal-text{display:flex;flex-direction:column;gap:2px;padding:11px 0}
.og-t{font-size:18px;line-height:24px;font-weight:600;color:#FFF4F6;letter-spacing:-.012em}
.og-meta{font-size:13px;line-height:18px;font-weight:500;color:#FF8798}
.og.is-done .og-t{color:var(--ink3);text-decoration:line-through;text-decoration-color:rgba(98,217,255,.45)}
.og.is-done .og-meta{color:var(--ink3)}
.ogoals.quake{animation:quake .6s cubic-bezier(.36,.07,.19,.97)}
.btn-plain.danger-t{color:#FF8A95}
.hint-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;margin-top:10px;padding:0 6px 0 18px;border-radius:18px;font-size:15px;color:var(--ink2);background:rgba(200,230,255,.035);border:.5px solid rgba(170,228,255,.1)}
.hint-row b{font-weight:600;color:var(--ice)}
.hint-row .ic{width:18px;height:18px;margin-right:6px;color:var(--ink3)}

/* ---------- Ideen-Karte ---------- */
.idea-card{margin-top:12px;padding:16px 16px 14px}
.sec-h + .idea-card{margin-top:0}
.idea-meta{display:flex;align-items:center;gap:7px;font-size:13px;line-height:18px;color:var(--ink3)}
.idea-meta .ic{width:17px;height:17px;color:var(--ice)}
.idea-text{margin:8px 0 14px;font-size:17px;line-height:23px;overflow-wrap:anywhere}
.idea-actions{display:flex;gap:8px}
.pill{
  flex:1 1 auto;height:44px;padding:0 11px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;
  font-size:15px;font-weight:600;color:var(--ink2);background:rgba(200,230,255,.06);border:.5px solid var(--edge);
  transition:transform .2s var(--ease),background .2s;
}
.pill:active{transform:scale(.95);background:rgba(200,230,255,.13)}
.pill.go{color:#04131C;background:linear-gradient(180deg,#CFF4FF,#6BDAFF);border-color:transparent;box-shadow:0 6px 20px rgba(64,196,245,.26)}
.pill.quiet{background:none;border-color:transparent;color:var(--ink3)}

/* ---------- Leer-Zustände ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:46px 24px 20px}
.empty-ic{position:relative;width:76px;height:76px;margin-bottom:20px;border-radius:50%;display:grid;place-items:center;color:var(--ice);border:.5px solid var(--edge2);background:radial-gradient(circle at 50% 30%,rgba(98,217,255,.16),rgba(98,217,255,.02) 70%);box-shadow:0 0 34px rgba(98,217,255,.12),inset 0 0 18px rgba(98,217,255,.08)}
.empty-ic::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:.5px solid rgba(150,228,255,.14)}
.empty-ic .ic{width:30px;height:30px}
.empty h3{font-size:20px;line-height:25px;font-weight:600;letter-spacing:-.016em}
.empty p{margin-top:6px;max-width:270px;font-size:15px;line-height:21px;color:var(--ink2)}
.empty.small{padding:30px 24px 10px}

/* ---------- Chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior:contain;margin:0 -20px;padding:2px 20px}
.chips::-webkit-scrollbar{display:none}
.chip{
  position:relative;flex:none;height:44px;min-width:44px;padding:0 15px;border-radius:22px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;
  font-size:15px;font-weight:500;color:var(--ink2);
  background:rgba(200,230,255,.05);border:.5px solid var(--edge);
  transition:background .22s ease,color .22s ease,border-color .22s ease,box-shadow .3s ease,transform .22s var(--ease);
}
.chip:active{transform:scale(.95)}
.chip.on{color:var(--ice);background:rgba(98,217,255,.16);border-color:rgba(150,228,255,.6);box-shadow:inset 0 0 14px rgba(98,217,255,.14)}
.chip .ic{width:17px;height:17px}
.chip.dim{opacity:.4}
.filter{margin-top:20px}

/* ---------- Erledigt ---------- */
.done-toggle{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 4px;font-size:15px;font-weight:600;color:var(--ink2)}
.done-toggle .n{font-weight:400;color:var(--ink3)}
.done-toggle .ic{margin-left:auto;width:20px;height:20px;color:var(--ink3);transition:transform .35s var(--ease)}
.done-toggle[aria-expanded="true"] .ic{transform:rotate(180deg)}
.more{display:block;width:100%;min-height:48px;margin-top:8px;border-radius:18px;text-align:center;font-size:15px;font-weight:600;color:var(--ice)}

/* ---------- Journal ---------- */
.jcard{padding:6px 18px}
.jf{display:block;padding:16px 0 18px}
.jf + .jf{border-top:.5px solid rgba(190,226,255,.11)}
.jq{display:block;margin-bottom:8px;font-size:15px;line-height:20px;font-weight:600;color:var(--ice)}
.grow{display:grid}
.grow::after{content:attr(data-v) " ";visibility:hidden;white-space:pre-wrap}
.grow > textarea,.grow::after{grid-area:1/1/2/2;min-width:0;padding:0;border:0;overflow-wrap:anywhere;font:inherit;letter-spacing:inherit}
.grow > textarea{overflow:hidden}
.jf .grow{font-size:18px;line-height:28px;min-height:56px;letter-spacing:-.008em}
.jbar{display:flex;align-items:center;gap:14px;margin-top:16px}
.jstate{flex:1;font-size:13px;line-height:18px;color:var(--ink3);padding-left:4px}
.jbar .btn{width:auto;padding:0 28px}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 1px 0 14px;border-radius:23px;background:rgba(200,230,255,.05);border:.5px solid var(--edge)}
.search .ic{width:19px;height:19px;color:var(--ink3)}
.search input{flex:1;min-width:0;height:44px;font-size:17px}
.search button{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--ink3)}
.search button .ic{width:16px;height:16px}
.jlist{margin-top:14px}
.jitem{display:block;width:100%;padding:14px 18px}
.jitem-date{display:block;font-size:15px;line-height:20px;font-weight:600}
.jitem-text{margin-top:4px;font-size:15px;line-height:21px;color:var(--ink2);overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.jitem-text mark{background:rgba(98,217,255,.24);color:var(--ice);border-radius:4px;padding:0 2px}
.jempty{padding:8px 4px 6px;font-size:15px;line-height:21px;color:var(--ink3)}

/* ---------- Tab-Leiste ---------- */
#tabbar{
  position:absolute;left:50%;bottom:max(14px,calc(var(--sab) - 8px));z-index:20;
  width:min(calc(100% - 28px),430px);height:66px;padding:0 6px;border-radius:33px;
  display:grid;grid-template-columns:1fr 1fr 68px 1fr 1fr;align-items:center;
  transform:translateX(-50%);
  background:rgba(14,21,32,.78);
  -webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);
  border:.5px solid var(--edge);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.13),0 18px 44px rgba(0,0,0,.55);
  transition:opacity .2s ease,transform .3s var(--ease);
}
body.kb-open #tabbar{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(20px)}
.tab{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink3);font-size:10.5px;line-height:13px;font-weight:500;letter-spacing:.01em;transition:color .25s ease,transform .25s var(--ease)}
.tab .ic{width:26px;height:26px;transition:filter .25s ease}
.tab:active{transform:scale(.9)}
.tab.on{color:var(--ice)}
.tab.on .ic{filter:drop-shadow(0 0 7px rgba(98,217,255,.55))}
.tab[data-tab="tasks"].on{color:#D6CEFF}.tab[data-tab="tasks"].on .ic{filter:drop-shadow(0 0 7px rgba(150,132,255,.6))}
.tab[data-tab="ideas"].on{color:#FFE2B5}.tab[data-tab="ideas"].on .ic{filter:drop-shadow(0 0 7px rgba(255,190,98,.55))}
.tab[data-tab="journal"].on{color:#BDF8E4}.tab[data-tab="journal"].on .ic{filter:drop-shadow(0 0 7px rgba(96,236,190,.55))}
#plus{
  position:relative;justify-self:center;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#03131C;
  background:radial-gradient(circle at 34% 26%,#E6FAFF 0%,#8FE4FF 38%,#3EC2F3 100%);
  box-shadow:0 0 0 .5px rgba(255,255,255,.55) inset,0 0 0 5px rgba(98,217,255,.08),0 0 26px rgba(98,217,255,.42),0 8px 20px rgba(0,0,0,.4);
  transition:transform var(--pop-d) var(--pop);
}
#plus .ic{width:26px;height:26px}
#plus svg{stroke-width:2}
#plus:active{transform:scale(.9)}

/* ---------- Ebenen: Sheets und Dialoge ---------- */
.layer{position:fixed;inset:0;z-index:50}
.backdrop{
  position:absolute;left:0;right:0;top:-160px;bottom:-160px;cursor:pointer;touch-action:none;
  background:rgba(2,5,10,.56);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  opacity:0;transition:opacity .3s ease;
}
.layer.open .backdrop{opacity:1}
.sheet-pos{
  position:absolute;left:0;right:0;bottom:0;padding:0 8px max(6px,calc(var(--sab) - 28px));display:flex;justify-content:center;pointer-events:none;
  transform:translate3d(0,calc(-1 * var(--kb)),0);transition:transform .3s cubic-bezier(.25,.85,.3,1);
}
.sheet{
  pointer-events:auto;position:relative;width:100%;max-width:540px;display:flex;flex-direction:column;
  max-height:calc(var(--vvh) - var(--sat) - 22px);
  border-radius:38px;background:var(--sheet);
  -webkit-backdrop-filter:blur(34px) saturate(170%);backdrop-filter:blur(34px) saturate(170%);
  border:.5px solid var(--edge);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.15),0 -8px 60px rgba(0,0,0,.5),0 0 60px rgba(70,190,255,.06);
  opacity:0;transform:translate3d(0,72px,0) scale(.965);transform-origin:50% 100%;
  transition:transform .26s cubic-bezier(.4,0,.9,.6),opacity .2s ease;
}
.layer.open .sheet{opacity:1;transform:none;transition:transform var(--spring-d) var(--spring),opacity .22s ease}
.sheet.tall{height:calc(var(--vvh) - var(--sat) - 22px)}
.grab{flex:none;position:relative;z-index:3;width:150px;margin:0 auto -12px;padding:8px 0 14px;touch-action:none}
.grab::before{content:"";display:block;width:38px;height:5px;margin:0 auto;border-radius:3px;background:rgba(222,234,247,.26)}
.sheet-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:2px 12px 4px 22px;touch-action:none}
.sheet-head h2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.02em}
.sheet-head .link{padding:0 10px}
.sheet-body{flex:1 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none;padding:6px 20px calc(20px + min(var(--sab),12px))}
.sheet-body::-webkit-scrollbar{display:none}
.sheet-foot{flex:none;padding:10px 20px calc(18px + min(var(--sab),12px))}
.sheet-body:not(:last-child){padding-bottom:20px}
body.kb-open .sheet-pos{padding-bottom:10px}
body.kb-open .sheet-body{padding-bottom:18px}
body.kb-open .sheet-foot{padding-bottom:16px}

/* Erfassen */
.e-text{margin:6px 2px 12px;font-size:21px;line-height:28px;font-weight:500;letter-spacing:-.016em}
.e-text.grow::after{max-height:84px;overflow:hidden}
.e-text.grow > textarea{max-height:84px;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.e-text.grow > textarea::-webkit-scrollbar{display:none}
.e-text.multi.grow::after,.e-text.multi.grow > textarea{max-height:140px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;height:50px;padding:2px;border-radius:25px;background:rgba(200,230,255,.055);border:.5px solid var(--edge)}
.seg button{position:relative;z-index:1;min-height:44px;border-radius:23px;text-align:center;font-size:15px;font-weight:600;color:var(--ink3);transition:color .25s ease}
.seg button.on{color:var(--ink)}
.seg i{position:absolute;z-index:0;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:22px;background:rgba(190,232,255,.15);border:.5px solid var(--edge2);box-shadow:0 0 16px rgba(98,217,255,.14);transition:transform var(--spring-d) var(--spring)}
.seg[data-i="1"] i{transform:translateX(100%)}
.fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .36s var(--ease),opacity .26s ease}
.fold > div{min-height:0;overflow:hidden;overflow:clip}
.fold.off{grid-template-rows:0fr;opacity:0;pointer-events:none}
.frow{display:flex;align-items:center;gap:10px;padding-top:10px}
.frow > .ic{width:20px;height:20px;color:var(--ink3)}
.frow .chips{flex:1;min-width:0;gap:6px;margin:0 -20px 0 0;padding:2px 20px 2px 0}
.frow .chip{padding:0 12px;font-size:14.5px}
.chip-date input{position:absolute;inset:0;width:100%;height:100%;min-width:0;opacity:0;font-size:16px;cursor:pointer}
.nudge{animation:nudge .42s var(--ease)}
@keyframes nudge{0%,100%{transform:none}20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}}
.nudge .chip{border-color:var(--edge2)}
.e-note{padding:12px 2px 0;font-size:14px;line-height:19px;color:var(--ink3)}
.e-actions{display:flex;flex-direction:column;gap:6px;padding-top:16px}
.e-secondary{display:flex;gap:8px}
body.kb-open .e-secondary{display:none}
/* Beim Tippen bleiben nur die nötigen Zeilen, damit Speichern über der Tastatur sichtbar ist */
body.kb-open .fold.kbhide:not(:focus-within){display:none}
body.kb-open #L-entry .frow{padding-top:7px}
body.kb-open #L-entry .e-actions{padding-top:12px}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:26px;text-align:center;font-size:17px;font-weight:600;letter-spacing:-.01em;transition:transform .22s var(--ease),opacity .2s ease,background .25s ease,color .25s ease,box-shadow .25s ease}
.btn:active{transform:scale(.97)}
.btn-primary{color:#03131C;background:linear-gradient(180deg,#D4F6FF 0%,#77DDFF 52%,#42C5F4 100%);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.55),0 8px 26px rgba(64,196,245,.32),0 0 40px rgba(98,217,255,.14)}
.btn-primary[aria-disabled="true"]{color:var(--ink3);background:rgba(200,230,255,.07);box-shadow:inset 0 0 0 .5px var(--edge)}
.btn-ghost{color:var(--ice);background:rgba(98,217,255,.09);border:.5px solid var(--edge)}
.btn-plain{color:var(--ink2)}
.btn-danger{color:var(--danger)}
.btn.sm{height:46px;font-size:16px}

/* Tag planen */
.plan-date{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:12px 4px 12px;font-size:15px;line-height:20px;color:var(--ink2)}
.slots{padding:0 6px 0 16px;border-radius:24px}
.slot{display:flex;align-items:center;gap:12px;min-height:56px}
.slot + .slot{border-top:.5px solid rgba(190,226,255,.11)}
.slot-n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ice);border:.5px solid var(--edge2);box-shadow:inset 0 0 8px rgba(98,217,255,.12)}
.slot-t{flex:1;min-width:0;padding:10px 0;font-size:17px;line-height:22px;font-weight:500;overflow-wrap:anywhere}
.slot.free .slot-n{color:var(--ink3);border:.5px dashed var(--ink4);box-shadow:none}
.slot.free .slot-t{color:var(--ink3);font-weight:400}
.slot.is-done .slot-t{color:var(--ink3);text-decoration:line-through}
.slot-x{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--ink3)}
.slot-x .ic{width:18px;height:18px}
.addfree{display:flex;align-items:center;gap:8px;margin-top:12px;height:52px;padding:0 4px 0 18px;border-radius:26px;background:rgba(200,230,255,.05);border:.5px solid var(--edge);transition:opacity .25s ease}
.addfree.dim{opacity:.4;pointer-events:none}
.addfree input{flex:1;min-width:0;height:50px;font-size:17px}
.addfree button{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ice);background:rgba(98,217,255,.12);border:.5px solid var(--edge2);transition:opacity .2s,transform .2s var(--ease)}
.addfree button:active{transform:scale(.9)}
.addfree button[aria-disabled="true"]{opacity:.35}
.pick{display:flex;align-items:stretch;width:100%;min-height:56px;transition:opacity .25s ease}
.pick + .pick{border-top:.5px solid rgba(190,226,255,.11)}
.pick.dim{opacity:.36}
.pick .sel{flex:0 0 54px;display:grid;place-items:center}
.pick .sel i{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;color:var(--ink3);border:1.5px solid rgba(214,234,250,.34);transition:background .22s,border-color .22s,color .22s,box-shadow .3s}
.pick .sel .ic{width:15px;height:15px}
.pick .sel svg{stroke-width:2.2}
.pick.on .sel i{color:#04131C;background:linear-gradient(160deg,#D2F5FF,#5FD6FF);border-color:#9BE7FF;box-shadow:0 0 14px var(--glow)}
.count{font-variant-numeric:tabular-nums;font-weight:400;color:var(--ink3)}
.count.full{color:var(--ice)}

/* Listen in Einstellungen */
.list{overflow:hidden}
.li{display:flex;align-items:center;gap:13px;width:100%;min-height:56px;padding:8px 14px 8px 18px;cursor:pointer}
.li + .li{border-top:.5px solid rgba(190,226,255,.11)}
.li:active{background:rgba(200,230,255,.06)}
.li-t{flex:1;min-width:0}
.li-t b{display:block;font-size:17px;line-height:22px;font-weight:400;overflow-wrap:anywhere}
.li-t span{display:block;margin-top:1px;font-size:13px;line-height:18px;color:var(--ink3)}
.li > .ic{width:22px;height:22px;color:var(--ice)}
.li > .ic.chev{width:17px;height:17px;color:var(--ink4)}
.li .dot{width:11px;height:11px;margin:0 5px}
.li.add b{color:var(--ice);font-weight:600}
.about{padding:26px 8px 6px;text-align:center;font-size:13px;line-height:19px;color:var(--ink3)}
.about b{display:block;margin-bottom:2px;font-size:15px;font-weight:600;color:var(--ink2)}
.field{display:flex;align-items:center;height:54px;padding:0 18px;border-radius:20px;background:rgba(200,230,255,.05);border:.5px solid var(--edge)}
.field input{flex:1;min-width:0;height:52px;font-size:18px}
.hues{display:grid;grid-template-columns:repeat(8,1fr);margin:14px -9px 2px}
.hue{height:44px;display:grid;place-items:center}
.hue i{position:relative;width:24px;height:24px;border-radius:50%;background:hsl(var(--h) 86% 72%);box-shadow:0 0 12px hsl(var(--h) 92% 62% / .5);transition:transform var(--pop-d) var(--pop)}
.hue.on i{transform:scale(1.12)}
.hue.on i::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid hsl(var(--h) 90% 80%)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}

/* Journal-Eintrag im Sheet */
.jsheet .jf:first-child{padding-top:6px}

/* Dialog */
.layer.center{display:grid;place-items:center;padding:24px}
.dialog{
  position:relative;width:100%;max-width:308px;padding:24px 18px 14px;border-radius:30px;text-align:center;
  background:rgba(18,26,39,.86);-webkit-backdrop-filter:blur(34px) saturate(170%);backdrop-filter:blur(34px) saturate(170%);
  border:.5px solid var(--edge);box-shadow:inset 0 .5px 0 rgba(255,255,255,.16),0 30px 80px rgba(0,0,0,.6);
  opacity:0;transform:scale(1.07);transition:transform .2s ease,opacity .18s ease;
}
.layer.open .dialog{opacity:1;transform:none;transition:transform var(--pop-d) var(--pop),opacity .2s ease}
.dialog h2{font-size:19px;line-height:24px;font-weight:600;letter-spacing:-.014em}
.dialog p{margin:8px 4px 18px;font-size:15px;line-height:21px;color:var(--ink2)}
.dialog .btn{height:48px}
.dialog .btn + .btn{margin-top:4px}
.btn-warn{color:#1C0508;background:linear-gradient(180deg,#FFC3C8,#FF8A95);box-shadow:0 8px 24px rgba(255,110,125,.22)}

/* Angebot nach dem Speichern */
.offer{padding:8px 4px 0;text-align:center}
.offer .empty-ic{margin:4px auto 16px;width:60px;height:60px}
.offer .empty-ic .ic{width:26px;height:26px}
.offer h2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.02em}
.offer p{margin:6px 0 20px;font-size:16px;line-height:22px;color:var(--ink2)}

/* Toast */
#toast{
  position:fixed;left:50%;z-index:90;bottom:calc(max(14px,calc(var(--sab) - 8px)) + 78px + var(--kb));
  display:flex;align-items:center;gap:6px;width:max-content;max-width:calc(100% - 40px);min-height:48px;padding:2px 8px 2px 20px;border-radius:24px;
  font-size:15px;line-height:20px;font-weight:500;
  background:rgba(22,31,45,.88);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  border:.5px solid var(--edge2);box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 30px rgba(98,217,255,.1);
  opacity:0;pointer-events:none;transform:translate3d(-50%,14px,0) scale(.96);
  transition:transform .22s ease,opacity .2s ease,bottom .3s cubic-bezier(.25,.85,.3,1);
}
#toast.show{opacity:1;pointer-events:auto;transform:translate3d(-50%,0,0);transition:transform var(--spring-d) var(--spring),opacity .2s ease,bottom .3s cubic-bezier(.25,.85,.3,1)}
#toast span{padding:8px 12px 8px 0}
#toast button{flex:none;height:44px;padding:0 14px;border-radius:22px;font-weight:600;white-space:nowrap;color:var(--ice)}
#toast button:active{background:rgba(98,217,255,.12)}

/* Update-Hinweis und Installationshinweis */
.notice{display:flex;gap:10px;align-items:flex-start;margin-bottom:22px;padding:14px 2px 14px 16px;border-radius:20px;font-size:14px;line-height:20px;color:var(--ink2)}
.notice > span:not(.ic){flex:1;min-width:0}
.notice b{color:var(--ink);font-weight:600}
.notice > .ic{flex:none;margin-top:1px;width:20px;height:20px;color:var(--ice)}
.notice .x{flex:none;width:44px;height:44px;margin:-12px 0;display:grid;place-items:center;color:var(--ink3)}
.notice .x .ic{width:16px;height:16px}
.notice.center{align-items:center;padding:8px 8px 8px 18px;font-size:15px}
.notice .pill{flex:none;padding:0 16px}

/* Licht beim Abhaken */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:30;pointer-events:none}
.quake{animation:quake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes quake{10%,90%{transform:translate3d(-1px,0,0)}20%,80%{transform:translate3d(2px,0,0)}30%,50%,70%{transform:translate3d(-3px,1px,0)}40%,60%{transform:translate3d(3px,-1px,0)}}
.goals.quake{box-shadow:inset 0 .5px 0 rgba(255,255,255,.2),0 18px 44px rgba(0,0,0,.36),0 0 54px rgba(70,190,255,.32)}

/* Start: HUD baut sich auf, Komet-Ring zeichnet sich, Haken fliegt in zwei Teilen ein und rastet ein,
   Licht umrundet den Bildschirmrand, dann gleitet die App herein (ca. 1,5 s, Tippen überspringt) */
#intro{position:fixed;inset:0;z-index:95;display:grid;place-items:center;pointer-events:auto;overflow:hidden;
  background:radial-gradient(70% 42% at 50% 46%,rgba(36,140,210,.16),rgba(36,140,210,0) 70%)}
.in-box{display:flex;flex-direction:column;align-items:center;margin-top:-6vh}
#intro svg{width:220px;height:220px;overflow:visible;fill:none;stroke-linecap:round;stroke-linejoin:round}
#intro svg *{transform-box:view-box;transform-origin:110px 110px}
.in-cross{stroke:rgba(150,228,255,.4);stroke-width:.8;opacity:0}
.in-h1{stroke:rgba(150,228,255,.42);stroke-width:4;stroke-linecap:butt;stroke-dasharray:.9 3.34;opacity:0}
.in-h2{stroke:rgba(150,228,255,.5);stroke-width:1.1;stroke-dasharray:62 10 14 10 4 12 96 18 2 16 40 10;opacity:0}
.in-h3{stroke:rgba(170,160,255,.5);stroke-width:1.2;stroke-dasharray:120 181.6;opacity:0}
.in-br{stroke:#BDEFFF;stroke-width:1.6;opacity:0;filter:drop-shadow(0 0 4px rgba(98,217,255,.8))}
.in-ring{stroke:#7FE0FF;stroke-width:3;stroke-dasharray:230.3 400;stroke-dashoffset:230.3;transform:rotate(-200deg);filter:drop-shadow(0 0 7px rgba(98,217,255,.85))}
.in-head{opacity:0;transform:rotate(-200deg)}
.in-head circle{fill:#fff;filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 10px rgba(98,217,255,1))}
.in-c1,.in-c2{stroke:#E4FAFF;stroke-width:3.4;opacity:0;filter:drop-shadow(0 0 6px rgba(98,217,255,.95));transform-origin:104.4px 124px!important}
.in-pulse{stroke:#BDEFFF;stroke-width:2;opacity:0}
.in-word{margin-top:18px;font-size:13px;line-height:16px;font-weight:300;letter-spacing:.9em;text-indent:.9em;color:#CDEFFF;opacity:0;text-shadow:0 0 12px rgba(98,217,255,.8)}
.in-hello{margin-top:10px;min-height:20px;font-size:15px;line-height:20px;font-weight:500;color:var(--ink2);opacity:0}
.in-scan{position:absolute;left:0;right:0;top:0;height:2px;opacity:0;background:linear-gradient(90deg,rgba(98,217,255,0),rgba(150,232,255,.75) 50%,rgba(98,217,255,0));box-shadow:0 0 18px rgba(98,217,255,.6)}
.in-scan::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:70px;background:linear-gradient(0deg,rgba(98,217,255,.08),rgba(98,217,255,0))}

body.go .in-cross{animation:in-cross 1.25s cubic-bezier(.2,.8,.2,1) both}
body.go .in-h1{animation:in-h1 .7s .05s cubic-bezier(.2,.8,.2,1) both}
body.go .in-h2{animation:in-h2 .8s .1s cubic-bezier(.2,.8,.2,1) both}
body.go .in-h3{animation:in-fade .4s .12s ease both,in-spin 2.6s .12s linear infinite}
body.go .in-ring{animation:in-ring .58s .08s cubic-bezier(.3,.7,.25,1) both}
body.go .in-head{animation:in-head .58s .08s cubic-bezier(.3,.7,.25,1) both}
body.go .in-c1{animation:in-c1 .26s .5s cubic-bezier(.3,1.4,.5,1) both}
body.go .in-c2{animation:in-c2 .28s .58s cubic-bezier(.3,1.4,.5,1) both}
body.go .in-br{animation:in-br .34s .6s cubic-bezier(.3,1.5,.5,1) both}
body.go .in-pulse{animation:in-pulse .6s .84s cubic-bezier(.2,.8,.2,1) both}
body.go .in-word{animation:in-word .7s .72s cubic-bezier(.2,.8,.2,1) both}
body.go .in-hello{animation:in-hello .5s .92s cubic-bezier(.2,.8,.2,1) both}
body.go .in-scan{animation:in-scan 1s .05s cubic-bezier(.5,0,.3,1) both}
@keyframes in-cross{0%{opacity:0;transform:scale(.7)}35%{opacity:1}70%{opacity:1;transform:scale(1)}100%{opacity:.25;transform:scale(1.02)}}
@keyframes in-h1{0%{opacity:0;transform:rotate(-70deg) scale(.82)}100%{opacity:1;transform:rotate(0) scale(1)}}
@keyframes in-h2{0%{opacity:0;transform:rotate(120deg) scale(.7)}100%{opacity:1;transform:rotate(0) scale(1)}}
@keyframes in-fade{from{opacity:0}to{opacity:1}}
@keyframes in-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes in-ring{0%{stroke-dashoffset:230.3;transform:rotate(-200deg);opacity:.4}100%{stroke-dashoffset:0;transform:rotate(-17deg);opacity:1}}
@keyframes in-head{0%{transform:rotate(-200deg);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:rotate(297deg);opacity:0}}
@keyframes in-c1{0%{opacity:0;transform:translate(-46px,34px) rotate(-55deg) scale(.6)}100%{opacity:1;transform:none}}
@keyframes in-c2{0%{opacity:0;transform:translate(42px,-48px) rotate(40deg) scale(.6)}100%{opacity:1;transform:none}}
@keyframes in-br{0%{opacity:0;transform:scale(1.6) rotate(12deg)}60%{opacity:1}100%{opacity:.85;transform:scale(1) rotate(0)}}

const partsFmt = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });

/* ===== Speicher: IndexedDB ===== */
const DB = (() => {
  const NAME = 'momentum', VER = 1;
  const KEYS = { tasks: 'id', ideas: 'id', topics: 'id', journal: 'date', days: 'date', meta: 'key' };
  const STORES = Object.keys(KEYS);
  let db = null;

  function open() {
    return new Promise((res, rej) => {
      let req;
      try { req = indexedDB.open(NAME, VER); } catch (e) { rej(e); return; }
      req.onupgradeneeded = () => {
        const d = req.result;
        for (const s of STORES) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: KEYS[s] });
      };
      req.onsuccess = () => {
        db = req.result;
        db.onversionchange = () => { try { db.close(); } catch (e) {} db = null; };
        db.onclose = () => { db = null; };
        res(db);
      };
      req.onerror = () => rej(req.error || new Error('open'));
    });
  }
  async function init() {
    for (let i = 0; ; i++) {
      try {
        await Promise.race([open(), wait(5000).then(() => { throw new Error('timeout'); })]);
        return;
      } catch (e) { if (i >= 2) throw e; await wait(250); }
    }
  }
  function tx(stores, mode, fn) {
    return new Promise((res, rej) => {
      let t;
      try { t = db.transaction(stores, mode); } catch (e) { rej(e); return; }
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error || new Error('tx'));
      t.onabort = () => rej(t.error || new Error('abort'));
      try { fn(t); } catch (e) { try { t.abort(); } catch (x) {} rej(e); }
    });
  }
  /* Schreibvorgänge laufen nacheinander; bei verlorener Verbindung einmal neu verbinden. */
  let chain = Promise.resolve();
  function run(stores, mode, fn) {
    const job = async () => {
      try { if (!db) await open(); await tx(stores, mode, fn); }
      catch (e) { await open(); await tx(stores, mode, fn); }
    };
    const p = chain.then(job, job);
    chain = p.catch(() => {});
    return p;
  }
  async function loadAll() {
    const out = {};
    await run(STORES, 'readonly', t => {
      for (const s of STORES) { const r = t.objectStore(s).getAll(); r.onsuccess = () => { out[s] = r.result || []; }; }
    });
    return out;
  }
  const put = (s, v) => run([s], 'readwrite', t => { t.objectStore(s).put(v); });
  const del = (s, k) => run([s], 'readwrite', t => { t.objectStore(s).delete(k); });
  const replaceAll = data => run(STORES, 'readwrite', t => {
    for (const s of STORES) { const os = t.objectStore(s); os.clear(); for (const v of (data[s] || [])) os.put(v); }
  });
  return { init, loadAll, put, del, replaceAll, STORES };
})();

function addTask(o) {

/* ----- Tagesziele ----- */

/* Verpasste Tagesziele früherer Tage bleiben präsent, bis sie erledigt, auf heute gelegt oder verworfen sind.

/* ----- Folge-Regeln: Stichwort in einer Aufgabe → Folgeaufgabe zum Ende der geplanten Zeit (meta 'rules') ----- */
function normRules(v) {

    if (!r || !str(r.word).trim() || !str(r.then).trim() || out.length >= 50) continue;
    out.push({ id: str(r.id, 80) || uid(), word: str(r.word, 40).trim(), then: str(r.then, 280).replace(/\s+/g, ' ').trim(), since: Number.isFinite(+r.since) && +r.since > 0 ? +r.since : Date.now() });

  /* Nur, was nach dem Anlegen der Regel fertig wird – alte Aufgaben erzeugen nichts nachträglich */
  if (t.done) return (t.doneAt || 0) >= r.since;

  const day = today(), mins = minNow(), made = [];
  for (const t of Array.from(S.tasks.values())) {

    made.push(addTask({ text: r.then, due: day, now: true, prio: t.prio, topicId: t.topicId, note: 'Folgt auf „' + taskTitle(t) + '“' }));
  }
  return made;
}

function bindSwipe(container, onComplete) {
  const TH = 86;
  let s = null;
  const reset = (st, animate) => {
    st.w.classList.remove('armed');
    st.row.style.transition = animate ? 'transform var(--spring-d) var(--spring)' : '';
    st.row.style.transform = '';
    st.under.style.transition = 'opacity .2s ease';
    st.under.style.opacity = '';
    setTimeout(() => { st.w.classList.remove('swiping'); st.row.style.transition = ''; st.under.style.transition = ''; }, 520);
  };
  container.addEventListener('touchstart', e => {
    s = null;
    if (e.touches.length !== 1) return;
    const w = e.target.closest('.rw[data-swipe]');
    if (!w || w.dataset.busy) return;
    const p = e.touches[0];
    s = { w, under: w.children[0], row: w.children[1], x: p.clientX, y: p.clientY, dx: 0, lock: false, armed: false, lx: p.clientX, lt: e.timeStamp, v: 0 };
  }, { passive: true });
  container.addEventListener('touchmove', e => {
    if (!s) return;
    const p = e.touches[0], dx = p.clientX - s.x, dy = p.clientY - s.y;
    if (!s.lock) {
      if (dx > 10 && Math.abs(dx) > Math.abs(dy) * 1.25) { s.lock = true; s.w.classList.add('swiping'); s.row.style.transition = 'none'; s.under.style.transition = 'none'; }
      else if (Math.abs(dy) > 10 || dx < -10) { s = null; return; }
      else return;
    }
    if (e.cancelable) e.preventDefault();
    const dt = e.timeStamp - s.lt;
    if (dt > 0) { s.v = (p.clientX - s.lx) / dt; s.lx = p.clientX; s.lt = e.timeStamp; }
    s.dx = Math.max(0, dx - 10);
    s.row.style.transform = 'translate3d(' + s.dx + 'px,0,0)';
    s.under.style.opacity = String(Math.min(1, s.dx / 44));
    const armed = s.dx >= TH;
    if (armed !== s.armed) { s.armed = armed; s.w.classList.toggle('armed', armed); if (armed) haptic(); }
  }, { passive: false });
  const end = cancelled => {
    if (!s) return;
    const st = s; s = null;
    if (!st.lock) return;
    suppressClick = Date.now();
    if (!cancelled && (st.armed || (st.v > 0.6 && st.dx > 36))) {
      st.w.dataset.busy = '1';
      st.w.classList.add('armed');
      const fly = reduced() ? 0 : 240;
      st.row.style.transition = 'transform ' + fly + 'ms cubic-bezier(.3,0,.7,1), opacity ' + fly + 'ms ease';
      st.row.style.transform = 'translate3d(' + (st.w.offsetWidth + 24) + 'px,0,0)';
      st.row.style.opacity = '0';
      onComplete(st.w, fly);
    } else reset(st, true);
  };
  container.addEventListener('touchend', () => end(false));
  container.addEventListener('touchcancel', () => end(true));
}

function exportData() {

  if (!ui.shareFailed && navigator.share && navigator.canShare && typeof File === 'function') {
    let file = null, can = false;
    for (const type of ['application/json', 'text/plain']) {
      try { file = new File([json], name, { type }); can = navigator.canShare({ files: [file] }); } catch (e) { can = false; }

/* ----- Lichtlinie: Bilanz des Tages ----- */
function balance() {
  const day = today();
  let done = 0, open = 0, over = 0;
  for (const t of S.tasks.values()) {
    if (t.done) { if (t.due <= day && t.doneAt && dayOf(t.doneAt) === day) done++; }
    else if (t.due < day) over++;
    else if (t.due === day) open++;
  }
  for (const g of liveGoals(day)) if (!g.taskId) { if (g.done) done++; else open++; }
  for (const d of S.days.values()) if (d.date < day) for (const g of d.goals) if (!g.taskId && g.done && g.doneAt && dayOf(g.doneAt) === day) done++;
  for (const o of overdueGoals(day)) if (!o.g.taskId) over++;
  return { done, open, over, total: done + open + over };
}
function renderBeams() {
  const b = balance();
  const pct = n => (b.total ? Math.round(n / b.total * 1000) / 10 : 0) + '%';
  const cap = () => {
    if (!b.total) return [];
    if (!b.open && !b.over) return [h('b', null, 'Alles erledigt')];
    return [h('b', null, b.done + '/' + b.total), ' erledigt', b.over ? [' · ', h('em', null, b.over + ' überfällig')] : null];
  };
  for (const el of $$('.beam')) {
    el.style.setProperty('--a', pct(b.done));
    el.style.setProperty('--o', pct(b.over));
    el.classList.toggle('calm', !b.total);
    fill($('.b-cap', el), cap());
  }
}

  /* Erfassen */
  eType(b) {
    E.type = b.dataset.type;
    const ta = eText();
    if (E.type === 'task' && /\n/.test(ta.value)) { ta.value = ta.value.replace(/\s*\n+\s*/g, ' '); $('#e-grow').dataset.v = ta.value; }
    syncEntry();
  },
  eWhen(b) {
    const first = !E.when;
    E.when = b.dataset.when; syncEntry();
    /* Die Zeile für den Zeitrahmen klappt auf: Speichern bleibt über der Tastatur sichtbar */
    if (first && KB.h > 0) setTimeout(() => { const sb = $('#L-entry .sheet-body'); if (sb) sb.scrollTop = sb.scrollHeight; }, 380);
  },
  ePrio(b) { E.prio = +b.dataset.prio; syncEntry(); },
  eDur(b) { const d = +b.dataset.dur; E.dur = E.dur === d ? null : d; syncEntry(); },
  eReopen() {
    const t = S.tasks.get(E.id);
    if (!t) return;
    setDone(t.id, false);
    haptic();
    closeLayer('L-entry');
    renderAll();
    toast('Wieder offen');
  },
  eTopic(b) { E.topicId = E.topicId === b.dataset.id ? null : b.dataset.id; syncEntry(); },
  eSave() { saveEntry(); },
  eDelete() {
    const t = S.tasks.get(E.id);
    if (!t) return;
    removeTask(t.id);
    closeLayer('L-entry');
    renderAll();
    toast('Aufgabe gelöscht', { action: 'Rückgängig', onAction: () => { restoreTask(t); renderAll(); } });
  },
  eGo() {
    E.mode = 'fromIdea'; E.type = 'task'; E.when = null;
    { const ta = eText(); ta.value = oneLine(ta.value); $('#e-grow').dataset.v = ta.value; }
    const sec = $('#e-secondary'); sec.replaceChildren(); sec.hidden = true;
    syncEntry();
  },
  eDrop() {
    const idea = S.ideas.get(E.id);
    if (!idea) return;
    removeIdea(idea.id);
    closeLayer('L-entry');
    renderAll();
    toast('Idee verworfen', { action: 'Rückgängig', onAction: () => { restoreIdea(idea); renderAll(); } });
  },

  /* Journal */
  jSave() {
    if (jEmpty(readFields(JR.els))) { nudge($('#j-editor')); return; }
    touchJ(JR.date, readFields(JR.els));
    flushJ(JR.date);
    const a = document.activeElement;
    if (a && a.blur) a.blur();
    haptic();
    jState('Gespeichert');
    const n = liveGoals(addDays(today(), 1)).length;
    $('#offer-text').textContent = n ? 'Morgen ist schon geplant.' : 'Morgen planen?';
    $('#offer-go').textContent = n ? 'Plan ansehen' : 'Morgen planen';
    openLayer('L-offer');
  },
  offerPlan() { closeLayer('L-offer'); openPlan('tomorrow'); },
  jOpen(b) { openJEntry(b.dataset.date); },
  jMore() { ui.jLimit += 30; renderJournalList(); },
  jClear() { const i = $('#j-search'); i.value = ''; ui.jQuery = ''; ui.jLimit = 30; $('#j-clear').hidden = true; renderJournalList(); },
  async jeDelete() {
    const date = JE.date;
    const ok = await dialog({ title: 'Eintrag löschen?', text: 'Der Eintrag vom ' + plainDate(date) + ' ist danach weg.', ok: 'Löschen', danger: true });
    if (!ok) return;
    clearTimeout(jTimers[date]); delete jTimers[date];
    S.journal.delete(date); dbDel('journal', date);
    closeLayer('L-jentry');
    renderJournalList();
    toast('Eintrag gelöscht');
  },

  /* Einstellungen */
  topicOpen(b) { openTopic(b.dataset.id || null); },
  topicHue(b) { T.hue = +b.dataset.hue; renderHues(); },
  topicSave() { saveTopic(); },
  async topicDelete() {
    const t = topicById(T.id);
    if (!t) return;
    const ok = await dialog({ title: '„' + t.name + '“ löschen?', text: 'Aufgaben und Ideen bleiben, nur ohne dieses Thema.', ok: 'Löschen', danger: true });
    if (!ok) return;
    removeTopic(t.id);
    closeLayer('L-topic');
    renderSettings();
    renderAll();
  },
  exportData() { exportData(); },
  dlgOk() { dialogAnswer(true); },
  dlgAlt() { dialogAnswer('alt'); },
  dlgCancel() { dialogAnswer(false); }
};

function quake(card) {
  if (reduced() || !card) return;
  card.classList.remove('quake'); void card.offsetWidth; card.classList.add('quake');
  setTimeout(() => card.classList.remove('quake'), 640);
}

/* ===== Ereignisse ===== */
function bindEvents() {
  for (const e of $$('[data-ic]')) e.innerHTML = IC[e.dataset.ic];

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const lay = b.closest('.layer');
    if (lay && !lay.classList.contains('open')) return;
    const fn = A[b.dataset.act];
    if (fn) fn(b, e);
  });
  for (const L of $$('.layer')) {
    const bd = $('.backdrop', L);
    /* Ein zweiter Tipp direkt nach dem Öffnen (Doppeltipp) schließt nichts und lässt die Tastatur offen */
    const guard = e => { if (Date.now() - (L._at || 0) < 380 && e.cancelable) e.preventDefault(); };
    bd.addEventListener('touchend', guard, { passive: false });
    bd.addEventListener('mousedown', guard);
    bd.addEventListener('click', () => {
      if (Date.now() - (L._at || 0) < 380) return;
      if (L.id === 'L-dialog') dialogAnswer(false); else if (topLayer() === L) closeLayer(L);
    });
    bindSheetDrag(L);
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && topLayer()) { if (topLayer().id === 'L-dialog') dialogAnswer(false); else closeLayer(topLayer()); }
  });

  /* Erfassen */
  const ta = eText();
  bindGrow($('#e-grow'), ta);
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && E.type === 'task' && !e.isComposing) { e.preventDefault(); saveEntry(); } });
  ta.addEventListener('input', () => {
    if (E.type === 'task' && ta.value.indexOf('\n') >= 0) { ta.value = ta.value.replace(/\n+/g, ' '); $('#e-grow').dataset.v = ta.value; }
    if (E.type !== 'task') keepEndVisible(ta);
    $('#e-save').setAttribute('aria-disabled', String(!entryValid()));
  });
  const det = $('#e-detail');
  bindGrow($('#e-detail-grow'), det);
  det.addEventListener('input', () => keepEndVisible(det));
  const dateEl = $('#e-date');
  const pickDate = () => {
    if (!validDay(dateEl.value)) dateEl.value = addDays(today(), 2);
    E.when = 'date'; E.date = dateEl.value; syncEntry();
  };
  dateEl.addEventListener('focus', pickDate);
  dateEl.addEventListener('click', () => { pickDate(); if (!mqCoarse.matches && dateEl.showPicker) { try { dateEl.showPicker(); } catch (e) {} } });
  const onDate = () => {
    if (validDay(dateEl.value)) { E.when = 'date'; E.date = dateEl.value; }
    else if (E.when === 'date') { E.when = null; E.date = null; }
    syncEntry();
  };
  dateEl.addEventListener('input', onDate);
  dateEl.addEventListener('change', onDate);
  const timeEl = $('#e-time-in');
  const onTime = () => { E.time = validTime(timeEl.value) ? timeEl.value : null; syncEntry(); };
  timeEl.addEventListener('input', onTime);
  timeEl.addEventListener('change', onTime);
  timeEl.addEventListener('click', () => { if (!mqCoarse.matches && timeEl.showPicker) { try { timeEl.showPicker(); } catch (e) {} } });

  /* Notiz */
  const nt = $('#note-text');
  bindGrow($('#note-grow'), nt);
  nt.addEventListener('input', () => keepEndVisible(nt));

  /* Tag planen */
  const pi = $('#plan-input');
  pi.addEventListener('input', () => $('#plan-add-btn').setAttribute('aria-disabled', String(pi.readOnly || !pi.value.trim())));
  pi.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); planAddFree(); } });

  /* Thema */
  $('#topic-name').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveTopic(); } });

  /* Journal */
  const js = $('#j-search');
  js.addEventListener('input', () => { ui.jQuery = js.value; ui.jLimit = 30; $('#j-clear').hidden = !js.value; renderJournalList(); });
  js.addEventListener('keydown', e => { if (e.key === 'Enter') js.blur(); });
  $('#j-editor').addEventListener('focusout', () => setTimeout(() => { if (JR.pendingRoll) rollJournal(); }, 50));

  /* Import */
  $('#import-file').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) importFile(f);
  });

  /* Wischen */
  const swipeDone = (w, fly) => {
    const id = w.dataset.id, t = S.tasks.get(id);
    if (!t) return;
    animating++;
    const r = w.getBoundingClientRect();
    FX.burst(r.left + 29, r.top + r.height / 2, { prio: t.prio, over: groupOf(t, today()) === 'over', rect: r });
    setDone(id, true);
    renderBeams();
    wait(fly).then(() => collapseRow(w)).then(() => {
      animEnd();
      toast('Erledigt', { action: 'Rückgängig', onAction: () => { setDone(id, false); renderAll(); } });
    });
  };
  bindSwipe($('#today'), swipeDone);

  /* Tipp auf einen Button lässt die Tastatur offen (Fokus bleibt im Textfeld) */
  document.addEventListener('mousedown', e => {
    if (isField(document.activeElement) && e.target.closest && e.target.closest('button') && !isField(e.target)) e.preventDefault();
  });

  /* Native-Gefühl: kein Zoom, kein Kontextmenü, :active auf iOS */
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
  document.addEventListener('touchstart', () => {}, { passive: true });
  document.addEventListener('contextmenu', e => { if (!isField(e.target)) e.preventDefault(); });
  document.addEventListener('dragstart', e => e.preventDefault());

  /* Nichts verlieren, wenn die App in den Hintergrund geht */
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushAllJ(); else wake(); });
  window.addEventListener('pagehide', flushAllJ);
  window.addEventListener('pageshow', wake);
  window.addEventListener('focus', wake);
}

/* ===== Tageswechsel um Mitternacht (deutsche Zeit) ===== */
let curDay = '', curHour = -1;
function wake() {
  const d = today(), hr = hourNow();
  if (d !== curDay) {
    curDay = d; curHour = hr;
    if (layers.some(L => L.id === 'L-plan')) renderPlan();
    rollJournal();
    renderAll();
  } else if (hr !== curHour) { curHour = hr; renderToday(); }
  checkUpdate();
}

/* ===== Offline und Updates ===== */
let lastCheck = 0;
function checkUpdate() {
  const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
  if (!sw || Date.now() - lastCheck < 60000) return;
  lastCheck = Date.now();
  try { sw.postMessage({ type: 'momentum-check' }); } catch (e) {}
}
function registerSW() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  navigator.serviceWorker.addEventListener('message', e => {
    const d = e.data;
    if (d && d.type === 'momentum-update') { ui.update = true; renderToday(); }
  });
  navigator.serviceWorker.register('sw.js').then(() => setTimeout(checkUpdate, 3000)).catch(() => {});
}

/* ===== Startbild für den Home-Bildschirm (iOS) ===== */
function startupImage() {
  if (!inSafariTab) return;
  try {
    const dpr = window.devicePixelRatio || 2;
    const w = Math.round(Math.min(screen.width, screen.height) * dpr), hgt = Math.round(Math.max(screen.width, screen.height) * dpr);
    const c = document.createElement('canvas');
    c.width = w; c.height = hgt;
    const x = c.getContext('2d');
    x.fillStyle = '#04070C';
    x.fillRect(0, 0, w, hgt);
    const r = w * 0.085, cx = w / 2, cy = hgt / 2;
    x.lineCap = 'round'; x.lineJoin = 'round';
    x.strokeStyle = '#7FE0FF'; x.lineWidth = Math.max(2, r * 0.11);
    x.shadowColor = 'rgba(98,217,255,.7)'; x.shadowBlur = r * 0.5;
    x.beginPath(); x.arc(cx, cy, r, -0.3, Math.PI * 2 - 1.1); x.stroke();
    x.beginPath(); x.moveTo(cx - r * 0.42, cy + r * 0.04); x.lineTo(cx - r * 0.1, cy + r * 0.36); x.lineTo(cx + r * 0.82, cy - r * 0.7); x.stroke();
    const link = document.createElement('link');
    link.rel = 'apple-touch-startup-image';
    link.media = 'screen and (orientation: portrait)';
    link.href = c.toDataURL('image/png');
    document.head.appendChild(link);
  } catch (e) {}
}

/* ===== Start-Animation ===== */
const INTRO = { t0: 0, out: false, MIN: 1180 };
function greeting() {
  const hr = hourNow();
  return hr < 5 ? 'Gute Nacht' : hr < 11 ? 'Guten Morgen' : hr < 18 ? 'Schön, dass du da bist' : hr < 23 ? 'Guten Abend' : 'Gute Nacht';
}
function startIntro() {
  const el = $('#intro');
  INTRO.t0 = performance.now();
  if (!el) return;
  if (reduced()) { INTRO.MIN = 0; return; }
  try { $('#in-hello').textContent = greeting(); } catch (e) {}
  document.body.classList.add('go');
  el.addEventListener('pointerdown', () => { if (document.body.classList.contains('ready')) endIntro(true); });
  setTimeout(() => { if (!INTRO.out) FX.intro(); }, 80);
  setTimeout(() => {
    if (INTRO.out) return;
    const r = $('#intro svg').getBoundingClientRect();
    FX.lock(r.left + r.width / 2, r.top + r.height / 2);
  }, 840);
}
/* Erst wenn die Daten geladen sind und der Aufbau gelaufen ist, gleitet die App herein */
function endIntro(now) {
  if (INTRO.out) return;
  const left = now ? 0 : Math.max(0, INTRO.MIN - (performance.now() - INTRO.t0));
  setTimeout(() => {
    if (INTRO.out) return;
    INTRO.out = true;
    const b = document.body, el = $('#intro');
    if (!el || reduced() || !b.classList.contains('go')) {
      if (el) el.remove();
      b.classList.remove('intro', 'go'); b.classList.add('live');
      return;
    }
    b.classList.add('enter');
    setTimeout(() => { el.remove(); b.classList.remove('intro', 'go'); }, 480);
    setTimeout(() => b.classList.add('live'), now ? 560 : 1050);
    setTimeout(() => b.classList.remove('enter'), 1800);
  }, left);
}

/* ===== Start ===== */
async function boot() {
  startIntro();
  try {
    await DB.init();
    hydrate(await DB.loadAll());
  } catch (e) {
    document.body.appendChild(h('div#fatal', null, h('div', null,
      h('h1', null, 'Speicher nicht erreichbar'),
      h('p', null, 'Momentum kann auf diesem Gerät gerade nichts sichern. Schließ die App ganz und öffne sie neu. Im privaten Modus von Safari funktioniert sie nicht.'))));
    document.body.classList.add('ready');
    endIntro(true);
    return;
  }
  try {
    seedTopics();
    curDay = today(); curHour = hourNow();
    initKeyboard();
    bindEvents();
    mountJournal();
    renderAll();
  } catch (e) {
    document.body.appendChild(h('div#fatal', null, h('div', null,
      h('h1', null, 'Start hat nicht geklappt'),
      h('p', null, 'Schließ Momentum ganz und öffne es neu. Deine Daten sind auf dem iPhone gespeichert und bleiben erhalten.'))));
    document.body.classList.add('ready');
    endIntro(true);
    return;
  }
  document.body.classList.add('ready');
  endIntro(false);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  setInterval(wake, 20000);
  setInterval(tickTasks, 30000);
  registerSW();
  setTimeout(startupImage, 1200);
}
boot();

})();
